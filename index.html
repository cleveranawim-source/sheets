<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📝 디지털 학습지</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디지털 학습지">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ind:#4f46e5;--grn:#16a34a;--red:#dc2626;--g1:#f3f4f6;--g2:#e5e7eb;--g3:#d1d5db;--g5:#6b7280;--g9:#111827}
/* touch-action:none → 브라우저 자체 핀치줌·당겨서새로고침 차단 (앱 제스처와 충돌 방지) */
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:-apple-system,'Noto Sans KR',Arial,sans-serif;background:#dde3ee;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}

/* ─── Upload ─── */
#upload{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:200;overflow-y:auto;touch-action:pan-y}
#upload-settings-btn{position:absolute;top:14px;right:14px;width:42px;height:42px;border:none;background:var(--g1);border-radius:10px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#upload-settings-btn:active{transform:scale(.88)}
.u-logo{font-size:48px;line-height:1}
.u-title{font-size:22px;font-weight:800;color:var(--g9)}
.u-sub{font-size:13px;color:var(--g5);text-align:center;line-height:1.6;max-width:400px}
.tabs{display:flex;gap:2px;background:var(--g1);border-radius:10px;padding:3px;width:100%;max-width:420px}
.tab{flex:1;padding:8px 4px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:600;color:var(--g5);cursor:pointer;transition:.15s;font-family:inherit}
.tab.on{background:#fff;color:var(--g9);box-shadow:0 1px 4px #0001}
.tab-pane{display:none;width:100%;max-width:420px;flex-direction:column;gap:10px}
.tab-pane.on{display:flex}
.dz{border:3px dashed var(--g2);border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;transition:.2s}
.dz:hover,.dz.over{border-color:var(--ind);background:#eef2ff}
.dz-icon{font-size:36px;margin-bottom:8px}
.dz p{font-size:14px;color:var(--g5)}
.dz small{font-size:12px;color:var(--g3);margin-top:4px;display:block}
.inp-row{display:flex;gap:8px}
.inp-row input{flex:1;padding:10px 12px;border:2px solid var(--g2);border-radius:10px;font-size:14px;outline:none;transition:.2s;font-family:inherit}
.inp-row input:focus{border-color:var(--ind)}
.hint{font-size:12px;color:var(--g5);line-height:1.6;background:var(--g1);border-radius:8px;padding:10px 12px}
.hint b{color:var(--g9)}
.btn{padding:10px 16px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
.btn:active{transform:scale(.95)}
.bi{background:var(--ind);color:#fff;box-shadow:0 2px 8px #4f46e540}
.bg{background:var(--grn);color:#fff;box-shadow:0 2px 8px #16a34a40}

/* ─── Toolbar ─── */
#bar{display:none;background:#fff;border-bottom:2px solid var(--g2);padding:7px 10px;align-items:center;gap:4px;flex-shrink:0;box-shadow:0 2px 8px #0001;z-index:10;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
.sep{width:1px;height:30px;background:var(--g2);margin:0 3px;flex-shrink:0}
.tb{width:42px;height:42px;flex-shrink:0;border:none;background:var(--g1);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.15s;font-family:inherit;font-weight:700;color:var(--g9);touch-action:manipulation}
.tb:active{transform:scale(.88)}
.tb.on{background:var(--ind);color:#fff;box-shadow:0 2px 8px #4f46e550}
.tb.on-red{background:var(--red);color:#fff;box-shadow:0 2px 8px #dc262650}
.sw{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:3px solid #fff;box-shadow:0 0 0 2px var(--g2);cursor:pointer;transition:.15s;touch-action:manipulation}
.sw:active{transform:scale(1.2)}
.sw.on{box-shadow:0 0 0 3px var(--ind)}
#szr{width:70px;flex-shrink:0;accent-color:var(--ind)}
.mla{margin-left:auto}

/* ─── Canvas ─── */
#ca{display:none;flex:1;overflow:hidden;position:relative;touch-action:none}
#cw{position:absolute;transform-origin:0 0;box-shadow:0 6px 32px #0002;border-radius:4px;overflow:hidden;background:#fff}
#cw canvas{display:block;position:absolute;top:0;left:0}
#bc{position:relative}
#dc{touch-action:none;z-index:1;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none} /* 길게 누를 때 뜨는 iOS 메뉴·돋보기 차단 */
/* 예측 잉크 레이어: 입력은 통과시키고 펜 끝 미리보기만 표시 */
#pc{z-index:2;pointer-events:none}

/* ─── Sticker Panel ─── */
#sp{display:none;background:#fff;border-bottom:2px solid var(--g2);padding:8px 12px;flex-shrink:0;box-shadow:0 2px 8px #0001}
.sp-tabs{display:flex;gap:2px;background:var(--g1);border-radius:8px;padding:2px;margin-bottom:8px}
.sp-tab{flex:1;padding:6px 4px;border:none;background:transparent;border-radius:6px;font-size:12px;font-weight:600;color:var(--g5);cursor:pointer;transition:.15s;font-family:inherit;touch-action:manipulation}
.sp-tab.on{background:#fff;color:var(--g9);box-shadow:0 1px 3px #0001}
.sp-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.sp-row::-webkit-scrollbar{height:3px}
.sp-row::-webkit-scrollbar-thumb{background:var(--g3);border-radius:2px}
.sk{min-width:46px;height:46px;border-radius:10px;background:var(--g1);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:.15s;flex-shrink:0;touch-action:manipulation}
.sk:active{transform:scale(.82)}
.sk.on{border-color:var(--ind);background:#eef2ff}
.sk-img{object-fit:cover;width:30px;height:30px;border-radius:4px}
.sk-add{font-size:22px;color:var(--g5);border:2px dashed var(--g3)}
.sk-add:hover{border-color:var(--ind);color:var(--ind);background:#eef2ff}

/* ─── Modal overlay ─── */
.overlay{position:fixed;inset:0;background:#0005;z-index:300;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:su .25s ease;touch-action:pan-y}
@keyframes su{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h2{font-size:17px;font-weight:800;color:var(--g9);margin-bottom:4px}
.sheet p{font-size:13px;color:var(--g5);margin-bottom:14px;line-height:1.5}
.sheet label{font-size:12px;font-weight:700;color:var(--g9);display:block;margin-bottom:6px}
.sheet input[type=text]{width:100%;padding:10px 12px;border:2px solid var(--g2);border-radius:10px;font-size:14px;outline:none;transition:.2s;font-family:inherit;margin-bottom:10px}
.sheet input[type=text]:focus{border-color:var(--ind)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;font-size:13px;padding:10px}
.b2{background:var(--g2);color:var(--g9)}
.code-box{background:var(--g9);color:#a5f3fc;font-size:11px;padding:12px;border-radius:10px;font-family:monospace;line-height:1.6;overflow-x:auto;margin:10px 0;white-space:pre}
.hdiv{border:none;border-top:1px solid var(--g2);margin:16px 0}
.share-url{background:var(--g1);border-radius:10px;padding:10px 12px;font-size:12px;word-break:break-all;font-family:monospace;margin-bottom:10px;line-height:1.6}
.qr-wrap{display:flex;justify-content:center;margin:10px 0}
.step-list{list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.step-list li{counter-increment:st;display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--g9);line-height:1.5}
.step-list li::before{content:counter(st);background:var(--ind);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.local-note{background:#fff7ed;border:1.5px solid #fcd34d;border-radius:10px;padding:10px 12px;font-size:13px;color:#92400e;margin-bottom:12px;line-height:1.5}

/* ─── Submit button (student) ─── */
.submit-btn{display:none;padding:8px 12px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;background:#0f766e;color:#fff;box-shadow:0 2px 8px #0f766e40;font-family:inherit;flex-shrink:0;touch-action:manipulation}
.submit-btn:active{transform:scale(.95)}
#submit-pdf-btn{background:#7c3aed;box-shadow:0 2px 8px #7c3aed40}
/* 떠 있는 제출 버튼: 툴바가 넘쳐도(아이패드 세로 등) 항상 보이게 캔버스 영역 오른쪽 위에 고정.
   오른쪽 아래는 오른손잡이가 필기할 때 손바닥을 얹는 자리라 오작동 위험 → 위쪽에 둠.
   컨테이너는 터치를 통과시키고(pointer-events:none) 버튼만 누를 수 있게 해 주변 필기를 막지 않음 */
#fab{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#fab .submit-btn{pointer-events:auto;align-items:center;gap:6px;min-height:46px;padding:11px 18px;font-size:15px;border-radius:999px;box-shadow:0 6px 18px #0f766e55,0 2px 4px #0002}
#fab #submit-pdf-btn{box-shadow:0 6px 18px #7c3aed55,0 2px 4px #0002}

/* ─── PDF page nav ─── */
#pdf-nav{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:99px;padding:4px 10px;box-shadow:0 2px 8px #0002;display:none;align-items:center;gap:8px;z-index:5;font-size:13px;font-weight:600;color:var(--g9)}
#pdf-nav button{width:28px;height:28px;border:none;background:var(--g1);border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}

/* ─── Save status ───────────────────────────────────────────── */
#save-ind{display:none;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800;white-space:nowrap;flex-shrink:0}
#save-ind.dirty{background:#fff7ed;color:#92400e}
#save-ind.saved{background:#ecfdf5;color:#047857}

/* ─── Toast ─────────────────────────────────────────────────── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(8px);background:#111827e0;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<!-- ═══ Upload Screen ═══ -->
<div id="upload">
  <button id="upload-settings-btn" onclick="openSettings()" title="설정">⚙️</button>
  <div class="u-logo">📝</div>
  <div class="u-title">디지털 학습지</div>
  <div class="u-sub">필기 · 스티커 · 텍스트 · 제출<br>교사용 도구 — 학습지를 불러와 학생에게 배포하세요<br><b style="color:#4f46e5">버전 v2.41</b></div>
  <div class="tabs">
    <button class="tab on" onclick="switchTab('file')">📂 파일</button>
    <button class="tab" onclick="switchTab('drive')">🟡 Drive</button>
    <button class="tab" onclick="switchTab('url')">🔗 URL</button>
  </div>
  <!-- Pane: File -->
  <div class="tab-pane on" id="pane-file">
    <div class="dz" id="dz" onclick="document.getElementById('fi').click()">
      <div class="dz-icon">🖼️</div>
      <p>이미지 또는 PDF를 드래그하거나 클릭해서 선택</p>
      <small>JPG · PNG · PDF (1페이지 사용)</small>
    </div>
    <input type="file" id="fi" accept="image/*,.pdf" style="display:none">
  </div>
  <!-- Pane: Drive -->
  <div class="tab-pane" id="pane-drive">
    <div class="hint"><b>Google Drive에서 이미지 공유하는 방법</b><br>Drive에서 이미지 우클릭 → <b>공유 → 링크 복사</b> → '모든 사용자' 권한으로 변경</div>
    <div class="inp-row">
      <input type="text" id="drive-in" placeholder="https://drive.google.com/file/d/.../view">
      <button class="btn bi" onclick="loadDrive()">불러오기</button>
    </div>
  </div>
  <!-- Pane: URL -->
  <div class="tab-pane" id="pane-url">
    <div class="inp-row">
      <input type="text" id="url-in" placeholder="https://... (이미지 직접 URL)">
      <button class="btn bi" onclick="loadUrl()">불러오기</button>
    </div>
  </div>
</div>

<!-- ═══ Toolbar ═══ -->
<div id="bar">
  <button class="tb on" id="m-draw" onclick="setMode('draw')" title="필기">🖌️</button>
  <button class="tb" id="m-select" onclick="setMode('select')" title="선택">☝️</button>
  <button class="tb" id="m-line" onclick="setMode('line')" title="직선">／</button>
  <button class="tb" id="m-curve" onclick="setMode('curve')" title="곡선">⌒</button>
  <button class="tb" id="m-erase" onclick="setMode('erase')" title="지우개">🧽</button>
  <button class="tb" id="m-sticker" onclick="setMode('sticker')" title="스티커">⭐</button>
  <button class="tb" id="m-text" onclick="setMode('text')" title="텍스트">T</button>
  <button class="tb" id="m-pan" onclick="setMode('pan')" title="화면 이동">✋</button>
  <div class="sep"></div>
  <div id="colg" style="display:flex;gap:4px;align-items:center;flex-shrink:0">
    <div class="sw on" style="background:#111" data-c="#111" onclick="setCol(this)"></div>
    <div class="sw" style="background:#dc2626" data-c="#dc2626" onclick="setCol(this)"></div>
    <div class="sw" style="background:#2563eb" data-c="#2563eb" onclick="setCol(this)"></div>
    <div class="sw" style="background:#16a34a" data-c="#16a34a" onclick="setCol(this)"></div>
    <div class="sw" style="background:#d97706" data-c="#d97706" onclick="setCol(this)"></div>
    <div class="sw" style="background:#7c3aed" data-c="#7c3aed" onclick="setCol(this)"></div>
  </div>
  <div id="szr-wrap" style="display:flex;align-items:center;gap:6px;flex-shrink:0">
    <div class="sep"></div>
    <input type="range" id="szr" min="0.25" max="20" step="0.25" value="2" oninput="setLw(this.value)">
    <!-- 현재 굵기 미리보기: 실제 픽셀 크기의 점 + 숫자 (고정 22px 틀 안에서 점만 커져 레이아웃 안 흔들림) -->
    <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex-shrink:0"><span id="szd" style="width:2px;height:2px;border-radius:50%;background:#111"></span></span>
    <span id="szv" style="font-size:11px;font-weight:800;color:var(--g5);min-width:28px;text-align:center;flex-shrink:0">2</span>
    <div class="sep"></div>
  </div>
  <div id="fsg" style="display:none;align-items:center;gap:6px;flex-shrink:0">
    <div class="sep"></div>
    <span style="font-size:11px;color:var(--g5);flex-shrink:0">크기</span>
    <select id="fss" style="padding:4px 8px;border:2px solid var(--g2);border-radius:8px;font-size:13px;background:var(--g1);color:var(--g9);cursor:pointer;font-family:inherit" onchange="S.tfs=+this.value">
      <option value="14">작게</option>
      <option value="18" selected="">보통</option>
      <option value="24">크게</option>
      <option value="36">더 크게</option>
      <option value="48">특대</option>
    </select>
    <div class="sep"></div>
  </div>
  <span style="font-size:9px;color:var(--g3);flex-shrink:0;align-self:flex-end;padding-bottom:2px">v2.41</span>
  <span id="save-ind" class="">자동저장 준비</span>
  <button class="tb" onclick="undo()" title="실행취소">↩️</button>
  <button class="tb" onclick="redo()" title="다시실행">↪️</button>
  <button class="tb" onclick="clearAll()" title="선택 삭제 / 전체 지우기">🗑️</button>
  <button id="zoom-ind" onclick="resetZoom()" style="display:none;padding:5px 10px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:#4f46e5;color:#fff;flex-shrink:0;touch-action:manipulation">🔍 100%</button>
  <div class="mla" style="display:flex;gap:6px;flex-shrink:0;align-items:center">
    <button class="tb" id="share-btn" onclick="openShare()" title="공유 링크">🔗</button>
    <button class="btn" id="save-pdf-btn" onclick="exportAllPagesPDF()" style="display:none;padding:8px 12px;font-size:13px;background:#7c3aed;color:#fff;box-shadow:0 2px 8px #7c3aed40;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit">📄 PDF 저장</button>
    <button class="btn bg" id="save-img-btn" onclick="exportImg()" style="padding:8px 12px;font-size:13px">💾 이미지 저장</button>
    <button class="tb" id="settings-btn" onclick="openSettings()" title="설정">⚙️</button>
    <button class="btn bi" id="deploy-btn" onclick="makeStudentFile()" style="padding:8px 12px;font-size:13px">📦 배포</button>
  </div>
</div>

<!-- ═══ Sticker Panel ═══ -->
<div id="sp">
  <div class="sp-tabs" id="sp-tabs"></div>
  <div class="sp-row" id="sp-row"></div>
  <input type="file" id="stk-fi" accept="image/*" style="display:none">
</div>

<script>
// ── Sticker categories ─────────────────────────────────────────────
const STK_CATS = [
  {id:'eval',  label:'평가',  items:['⭐','🌟','💯','🏆','🥇','🥈','🥉','✅','❌','✔️','👍','👏','💪','🙌','🎖️']},
  {id:'face',  label:'감정',  items:['😊','🤩','😎','😄','🥰','😮','🤔','😤','😢','🤗','😇','🤪','😅','🤓','😆']},
  {id:'study', label:'학습',  items:['📝','✏️','📚','📖','🎯','💡','💭','🔍','📌','❓','🔥','✨','🌈','🎉','🧩']},
  {id:'shape', label:'도형',  items:['❤️','🧡','💛','💚','💙','💜','🖤','🤍','⭕','🔺','🔷','🔶','🔵','🟢','⬛']},
  {id:'custom',label:'내 스티커', items:[]},
];
let curCat = 'eval';
const CUSTOM_STKS = []; // {src, img}
const IMG_CACHE = {};

// ── State ─────────────────────────────────────────────────────────
const S = {
  mode:'draw', color:'#111', lw:2, lwPen:2, lwErase:8, tfs:18, // 굵기는 펜 계열(그리기·직선·곡선)과 지우개가 따로 기억

  ops:[], hist:[], future:[], histBefore:null,
  opsCw:0, // 현재 S.ops 좌표가 기준으로 삼는 캔버스 가로폭 (화면 크기 변경 시 보정용)
  down:false, selStk:null,
  dragI:-1, dox:0, doy:0, selI:-1,
  resizing:false, rotating:false, rsx:0, rsy:0, rso:0, rbox:null, rotStart:0, rotCenter:null, shapeHandle:null,
  selList:[], groupDrag:false, lasso:null,
  img:null, src:null, imgUrl:null,
  cw:0, ch:0, nw:0, nh:0,
  _tainted:false,
  // PDF state
  pdfDoc:null, pdfPage:1, pdfTotal:1, pdfSrc:null,
  pdfOps:{}, pdfDims:{},
  // Zoom/pan state
  zoom:1, panX:0, panY:0,
};
// Settings (teacher-configured, embedded into student file)
const CFG = {
  webhookUrl: window.__WEBHOOK_URL__ || '',
  // fastInk(현재 획을 별도 레이어에만 그리는 모드)는 폐기 — 예측 잉크 정리 과정에서 획에 구멍이 나는
  // 구조적 문제가 있음. 확정 잉크를 본 레이어에 바로 증분으로 그리는 단일 경로가 정확하고 충분히 빠름.
  // (기존 학생 파일의 __FAST_INK__ 값은 무시)
  fastInk: false,
};

let bc,dc,bx,dx,caEl,pc,pctx;
// PTRS stores {x, y, t} in viewport coords (t = pointerType)
const PTRS=new Map();
// zoom state (precomputed at pinch start to avoid per-frame getBoundingClientRect)
let zooming=false,zoomDist0=1,zoomZoom0=1;
let zoomCaLeft=0,zoomCaTop=0,zoomCanvasX=0,zoomCanvasY=0;
// activeId: 현재 동작(필기/드래그/리사이즈)을 수행 중인 포인터. 이 포인터만 pm/pu에서 동작 가능
let activeId=null;
let rawSeen=false; // (pointerrawupdate 폐기 후 잔재 — 항상 false)
// penSeen: 펜이 감지되면 이후 손가락 단독 터치는 그리기 시작 금지.
// 손바닥이 먼저 닿아 가짜 획을 만들고, 펜이 닿는 순간 전체 다시 그리기로 0.2~0.4초 멈추는 문제의 원인 차단.
// 단, 펜을 30초 쉬면 자동 해제 — 펜을 잃어버렸거나 배터리가 없는 학생이 손가락으로 쓸 수 있게.
let penSeen=false, penLastT=0, fingerHintT=0;
let lastTapT=0, lastTapI=-1; // 텍스트 더블탭(내용 수정) 감지
// pageBusy: PDF 페이지를 새로 그리는 중 — 이 동안 페이지 이동·필기·저장/제출을 막아
// 옛 배경 위에 새 쪽 필기가 섞이거나, 연타로 앞 페이지 필기가 덮어써지는 것을 방지
let pageBusy=false, pendingPdfPage=0, pdfLoadFailed=false;
let textEditorSync=null; // 텍스트 입력창이 열려 있는 동안, 화면 크기가 바뀌면 입력창 위치를 다시 맞추는 함수
const r1=v=>Math.round(v*10)/10; // 필기 좌표 0.1px 단위 저장 — 눈에 보이는 차이 없이 자동저장 용량 절감
// QF: 캔버스 버퍼 배율(선명도), qTimer: 휠 줌 후 재렌더 디바운스
let QF=0,DQF=0,qTimer=null;
// dcRect: 캔버스 위치 캐시 — 매 pointermove마다 getBoundingClientRect(레이아웃 강제) 호출 방지
let dcRect=null;

// ── Local save / restore ─────────────────────────────────────────
const STORAGE_KEYS = {
  settings: 'digitalWorksheet:settings:v1',
  draftPrefix: 'digitalWorksheet:draft:v1:',
  studentName: 'digitalWorksheet:studentName:v1',
  draftIndex: 'digitalWorksheet:draftIndex:v1', // {자동저장키: 마지막 저장 시각} — 오래된 것부터 정리용
};
const MAX_DRAFTS=10; // 학습지별 자동저장본은 최근 10개까지만 보관
let saveTimer=null, restoreChecked=false, lastSaveKey=null;

// 저장소 '사용 가능' 여부만 확인 (읽기). 예전처럼 시험 쓰기를 하면 공간이 가득 찼을 때
// 사용 불가로 오판해 자동저장·복구가 통째로 멈췄음 → 공간 부족은 실제 쓰기 지점에서 처리
function canStore() {
  try { window.localStorage.getItem(STORAGE_KEYS.settings); return true; }
  catch(e) { return false; }
}
function readDraftIndex() {
  let idx=null;
  try { idx=JSON.parse(localStorage.getItem(STORAGE_KEYS.draftIndex)||'null'); } catch(_) {}
  if(!idx||typeof idx!=='object') idx={};
  // 키 목록만 훑음 (큰 자동저장본 내용을 읽지 않음)
  const present=new Set();
  for(let i=0;i<localStorage.length;i++) {
    const k=localStorage.key(i);
    if(k&&k.startsWith(STORAGE_KEYS.draftPrefix)) present.add(k);
  }
  for(const k in idx) if(!present.has(k)) delete idx[k];      // 이미 지워진 항목 정리
  present.forEach(k=>{ if(!(k in idx)) idx[k]=0; });          // 이전 버전이 남긴 자동저장본 = 가장 오래된 것으로 취급
  return idx;
}
function writeDraftIndex(idx) {
  try { localStorage.setItem(STORAGE_KEYS.draftIndex, JSON.stringify(idx)); } catch(_) {}
}
// 가장 오래된 자동저장본 하나 삭제 (지금 학습지 것은 보존). 지울 게 없으면 false
function evictOldestDraft(idx, keep) {
  let oldest=null;
  for(const k in idx) if(k!==keep&&(oldest===null||idx[k]<idx[oldest])) oldest=k;
  if(oldest===null) return false;
  try { localStorage.removeItem(oldest); } catch(_) {}
  delete idx[oldest];
  return true;
}

function hashText(text) {
  let h=2166136261;
  for(let i=0;i<text.length;i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h>>>0).toString(36);
}

function sourceFingerprint() {
  const src=S.pdfSrc||S.src||S.imgUrl||'';
  if(!src) return '';
  return hashText(src.slice(0,1800)+'|'+src.slice(-1800)+'|'+src.length);
}

function draftKey() {
  const fp=sourceFingerprint();
  return fp ? STORAGE_KEYS.draftPrefix + fp : null;
}

function markSaveState(text, kind='saved') {
  const el=document.getElementById('save-ind');
  if(!el) return;
  el.style.display=S.img?'inline-flex':'none';
  el.classList.remove('dirty','saved');
  el.classList.add(kind);
  el.textContent=text;
}

function rememberCurrentPDFPage() {
  if(S.pdfDoc&&S.pdfPage) {
    // 깊은 복사: 이후 화면 크기 보정(rescale)이 저장본까지 변형하지 않도록
    S.pdfOps[S.pdfPage]=cloneOpsState(S.ops);
    S.pdfDims[S.pdfPage]={cw:S.opsCw||S.cw,ch:S.ch};
  }
}

function cloneOpsState(ops=S.ops) {
  // structuredClone이 JSON 왕복보다 훨씬 빠름 — 필기가 쌓여도 펜 댈 때 끊기지 않게
  try { if(window.structuredClone) return structuredClone(ops||[]); } catch(_) {}
  return JSON.parse(JSON.stringify(ops||[]));
}
function sameOpsState(a,b) {
  a=a||[]; b=b||[];
  if(a.length!==b.length) return false; // 획 추가/삭제는 길이만으로 판정 (전체 직렬화 생략)
  return JSON.stringify(a)===JSON.stringify(b);
}
function beginHistory() {
  if(!S.histBefore) S.histBefore=cloneOpsState();
}
// 그리기/지우개 전용: 획은 끝에 하나 추가될 뿐이므로 스냅샷 복사를 펜 뗄 때로 미룸 (펜 닿는 순간 지연 제거)
function beginHistoryAppend() {
  if(!S.histBefore) S.histBefore='__append__';
}
// 실행취소 기록 항목은 두 종류:
//  · 배열  = 그 시점 전체 필기 사본 (이동·크기조절·삭제 등 기존 획을 바꾸는 동작)
//  · {append:true} = '끝에 하나 추가됨' 표시 (획·텍스트·스티커 추가). 사본 없음.
// 예전엔 획 하나 그을 때마다 지금까지 필기 전체를 복사해 저장 → 쓸수록 펜 뗄 때 느려지고 메모리가 수백 MB까지 불어났음.
// 되돌리기는 항상 역순이므로, append 표시를 되돌릴 때 '마지막 획'이 곧 그때 추가한 획이다.
function commitHistory() {
  if(!S.histBefore) return false;
  if(S.histBefore==='__append__') {
    S.histBefore=null;
    S.hist.push({append:true});
    if(S.hist.length>80) S.hist.shift();
    S.future=[];
    return true;
  }
  if(!sameOpsState(S.histBefore,S.ops)) {
    S.hist.push(S.histBefore);
    if(S.hist.length>80) S.hist.shift();
    S.future=[];
    S.histBefore=null;
    return true;
  }
  S.histBefore=null;
  return false;
}
function cancelHistory() { S.histBefore=null; }
function restoreOpsState(snapshot) {
  S.ops=cloneOpsState(snapshot);
  S.selI=-1; S.selList=[]; S.dragI=-1;
  redraw(); scheduleDraftSave();
}
function selectedIds() {
  if(S.selList&&S.selList.length) return [...new Set(S.selList)].filter(i=>i>=0&&i<S.ops.length);
  return (S.selI>=0&&S.selI<S.ops.length)?[S.selI]:[];
}
function deleteSelectedOps() {
  const ids=selectedIds();
  if(!ids.length) return false;
  beginHistory();
  ids.sort((a,b)=>b-a).forEach(i=>S.ops.splice(i,1));
  S.selI=-1; S.selList=[]; S.dragI=-1;
  commitHistory();
  redraw(); scheduleDraftSave(); toast('선택 항목 삭제됨');
  return true;
}

function loadStoredSettings() {
  if(!canStore()) return;
  try {
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEYS.settings)||'null');
    if(!saved) return;
    if(!window.__WEBHOOK_URL__ && saved.webhookUrl) CFG.webhookUrl=saved.webhookUrl;
  } catch(e) {}
}

function persistSettings() {
  if(!canStore()) return;
  try { // 공간이 가득 차도 설정 창이 멈추지 않게 (저장 실패는 이번 화면에만 적용)
    localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify({
      webhookUrl: CFG.webhookUrl,
      fastInk: CFG.fastInk,
      fastInkVersion: 2,
      updatedAt: new Date().toISOString(),
    }));
  } catch(_) { toast('⚠️ 저장 공간이 부족해 설정을 기기에 기억하지 못했어요'); }
}

function saveDraftNow() {
  if(S.down){ scheduleDraftSave(); return; } // 필기 중에는 저장 작업을 미룸 (획 끊김 방지)
  if(!canStore()||!S.img) return;
  const key=draftKey(); if(!key) return;
  rememberCurrentPDFPage();
  const payload={
    savedAt:new Date().toISOString(),
    pdfPage:S.pdfPage,
    pdfTotal:S.pdfTotal,
    ops:S.ops,
    pdfOps:S.pdfOps,
    pdfDims:S.pdfDims,
    cw:S.cw, ch:S.ch, nw:S.nw, nh:S.nh,
  };
  const data=JSON.stringify(payload);
  const idx=readDraftIndex();
  idx[key]=Date.now();
  // 학습지를 여러 장 쓰면 자동저장본이 끝없이 쌓여 공간이 가득 참 → 최근 MAX_DRAFTS개만 유지
  while(Object.keys(idx).length>MAX_DRAFTS && evictOldestDraft(idx,key)) {}
  for(;;) {
    try { localStorage.setItem(key, data); break; }
    catch(e) {
      // 공간 부족 → 다른 학습지의 오래된 자동저장본부터 비우고 재시도 (지금 학습지 것은 보존)
      if(!evictOldestDraft(idx,key)) { writeDraftIndex(idx); markSaveState('저장 공간 부족','dirty'); return; }
    }
  }
  writeDraftIndex(idx);
  lastSaveKey=key;
  markSaveState('자동저장 완료','saved');
}

function scheduleDraftSave() {
  if(!S.img) return;
  markSaveState('저장 중...','dirty');
  clearTimeout(saveTimer);
  // 필기 직후 메인 스레드를 점유하지 않도록 한가한 시점에 저장.
  // 1.5초: 글자 사이 짧은 쉼마다 저장하지 않게 (앱 전환·닫기 때는 visibilitychange에서 즉시 저장)
  saveTimer=setTimeout(()=>{
    if(window.requestIdleCallback) requestIdleCallback(()=>saveDraftNow(),{timeout:2000});
    else saveDraftNow();
  }, 1500);
}

function restoreDraftIfAvailable() {
  if(restoreChecked||!canStore()||!S.img) return;
  restoreChecked=true;
  const key=draftKey(); if(!key) return;
  let draft=null;
  try { draft=JSON.parse(localStorage.getItem(key)||'null'); } catch(e) {}
  if(!draft||!draft.savedAt) { markSaveState('자동저장 켜짐','saved'); return; }
  const when=new Date(draft.savedAt).toLocaleString('ko-KR');
  if(!confirm(`이 학습지의 자동저장본이 있습니다.\n저장 시각: ${when}\n\n이어서 작업할까요?`)) {
    markSaveState('자동저장 켜짐','saved');
    return;
  }
  S.pdfOps=draft.pdfOps||{};
  S.pdfDims=draft.pdfDims||{};
  S.pdfPage=draft.pdfPage||S.pdfPage||1;
  S.ops=cloneOpsState((draft.pdfOps&&draft.pdfOps[S.pdfPage])||draft.ops||[]);
  // 저장 당시의 캔버스 폭 기준 좌표 → 현재 화면 크기에 맞게 비율 보정
  S.opsCw=(S.pdfDims[S.pdfPage]&&S.pdfDims[S.pdfPage].cw)||draft.cw||0;
  if(S.pdfDoc && S.pdfPage>1) {
    pageBusy=true; dx.clearRect(0,0,S.cw,S.ch);
    renderPDFPage(S.pdfPage).then(()=>redraw()).catch(()=>{}).finally(()=>{pageBusy=false;});
  } else if(S.pdfSrc && !S.pdfDoc && S.pdfPage>1 && !pdfLoadFailed) {
    // 학생용 PDF: 복구할 쪽(예: 3쪽)의 배경을 그릴 PDF 뷰어가 아직 로딩 중.
    // 1쪽 배경 위에 3쪽 필기를 띄우지 않도록 잠시 비워 두고, 뷰어가 준비되면 그 쪽을 연다 (그동안 입력 잠금)
    pendingPdfPage=S.pdfPage; pageBusy=true; dx.clearRect(0,0,S.cw,S.ch);
    toast(`${S.pdfPage}페이지 여는 중...`);
  } else {
    if(S.pdfPage>1 && !S.pdfDoc) { // PDF 뷰어를 쓸 수 없음 → 1쪽으로 (다른 쪽 필기는 저장본에 그대로 보존)
      S.pdfPage=1; S.ops=cloneOpsState(S.pdfOps[1]||[]);
      S.opsCw=(S.pdfDims[1]&&S.pdfDims[1].cw)||draft.cw||0;
    }
    rescaleOpsToCanvas(); redraw();
  }
  const label=document.getElementById('pdf-page-label');
  if(label&&S.pdfTotal>1) label.textContent=`${S.pdfPage} / ${S.pdfTotal}`;
  markSaveState('복구됨','saved');
  toast('자동저장본을 복구했어요');
}

function deleteCurrentDraft() {
  const key=draftKey()||lastSaveKey;
  if(key&&canStore()) {
    try { localStorage.removeItem(key); const idx=readDraftIndex(); delete idx[key]; writeDraftIndex(idx); } catch(_) {}
  }
  markSaveState('자동저장 삭제됨','saved');
  toast('자동저장본을 삭제했어요');
}

// ── Boot ──────────────────────────────────────────────────────────
window.onload = () => {
  bc=document.getElementById('bc'); dc=document.getElementById('dc');
  bx=bc.getContext('2d');
  // desynchronized(저지연) 모드는 사용하지 않음 — Windows뿐 아니라 일부 갤럭시탭에서도
  // 투명 레이어가 검게 합성되어 학습지 이미지가 까맣게 가려지는 문제가 있음.
  // 반응 속도는 pointerrawupdate + 예측 잉크로 확보.
  dx=dc.getContext('2d');
  // 예측 잉크 레이어 (지연 시간 동안의 펜 끝 구간을 미리 표시)
  pc=document.getElementById('pc');
  pctx=pc.getContext('2d');
  caEl=document.getElementById('ca');

  buildStkPanel();
  loadStoredSettings();
  updateSizeLabel(); // 배포 파일에 직렬화된 교사 화면의 표시값을 현재 상태로 리셋

  document.getElementById('fi').onchange = e => { if(e.target.files[0]) loadFile(e.target.files[0]); };
  document.getElementById('stk-fi').onchange = e => { if(e.target.files[0]) addCustomSticker(e.target.files[0]); };

  const dz=document.getElementById('dz');
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);};

  dc.addEventListener('pointerdown',pd);
  dc.addEventListener('pointermove',pm);
  dc.addEventListener('pointerup',pu);
  dc.addEventListener('pointercancel',pu);
  // 길게 누르기 컨텍스트 메뉴 차단 (제스처 중단 방지)
  dc.addEventListener('contextmenu',e=>e.preventDefault());
  // 아이패드 스크리블(애플펜슬 손글씨→글자 변환)이 펜 획을 가로채 잉크가 군데군데 빠지는 문제 차단.
  // touch-action:none만으로는 막히지 않음 — touchmove 기본 동작을 직접 막아야 펜 이벤트가 끝까지 들어옴 (iPadOS 14~ 사파리의 알려진 동작).
  // 확대·이동은 앱이 포인터 이벤트로 직접 처리하므로 영향 없음
  dc.addEventListener('touchmove',e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});

  // 안전망: dc 밖에서 끝난 포인터(알림창·포커스 이동 등으로 pu를 놓친 경우) 정리
  const mopUp=e=>{
    if(!PTRS.has(e.pointerId)) return;
    PTRS.delete(e.pointerId);
    if(e.pointerId===activeId) {
      const changed=S.down&&(S.mode==='draw'||S.mode==='erase'||S.mode==='line'||S.mode==='curve'||S.mode==='select'||S.mode==='sticker'||S.mode==='text');
      const wasDrawing=S.down&&(S.mode==='draw'||S.mode==='erase');
      endAction();
      if(wasDrawing&&S.ops.length) finalizeStroke(S.ops[S.ops.length-1]);
      if(changed){commitHistory();scheduleDraftSave();}
    }
    if(zooming&&[...PTRS.values()].filter(p=>p.t==='touch').length<2){zooming=false;refreshQuality();}
  };
  window.addEventListener('pointerup',mopUp);
  window.addEventListener('pointercancel',mopUp);
  // 앱 전환·탭 닫힘: 진행 중이던 획·글자를 확정하고 즉시 저장
  // (예전엔 저장 대기 중에 안드로이드가 탭을 정리하면 마지막 몇 획이 사라질 수 있었음)
  const flushNow=()=>{
    const ted=document.querySelector('#cw textarea'); if(ted) ted.blur(); // 입력 중이던 글자 확정
    const wasDown=S.down;
    const drawnOp=S.down&&(S.mode==='draw'||S.mode==='erase')&&S.ops.length?S.ops[S.ops.length-1]:null;
    PTRS.clear(); endAction(); zooming=false;
    if(drawnOp) finalizeStroke(drawnOp);
    if(wasDown) commitHistory();
    clearTimeout(saveTimer); saveDraftNow();
  };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushNow(); });
  window.addEventListener('pagehide', flushNow);

  // PC/트랙패드: 마우스 휠로 확대·축소 (커서 위치 기준)
  caEl.addEventListener('wheel', e=>{
    if(!S.img) return;
    e.preventDefault();
    const factor=e.deltaY<0?1.12:1/1.12;
    const caR=caEl.getBoundingClientRect();
    const cx=e.clientX-caR.left, cy=e.clientY-caR.top;
    const cvX=(cx-S.panX)/S.zoom, cvY=(cy-S.panY)/S.zoom;
    const nz=Math.max(1,Math.min(5,S.zoom*factor));
    S.zoom=nz; S.panX=cx-cvX*nz; S.panY=cy-cvY*nz;
    clampPan(); applyTransform();
    clearTimeout(qTimer); qTimer=setTimeout(refreshQuality,250); // 휠 멈추면 선명 재렌더
  },{passive:false});

  document.addEventListener('keydown', e => {
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if((e.key==='Backspace'||e.key==='Delete')&&S.selI>=0&&S.selI<S.ops.length) {
      deleteSelectedOps(); e.preventDefault();
    }
  });

  if(window.__IMG__) {
    S.src=window.__IMG__;
    if(window.__PDF__) {
      S.pdfSrc=window.__PDF__; S.pdfTotal=window.__PDF_TOTAL__||1;
      loadSrc(window.__IMG__);
      loadPDFFromSrc(window.__PDF__).then(()=>{
        if(S.pdfTotal>1){
          document.getElementById('pdf-nav').style.display='flex';
          // 복구된 쪽 번호 그대로 표시 (예전엔 항상 "1 /"로 덮어써서 3쪽 작업이 1쪽처럼 보였음)
          document.getElementById('pdf-page-label').textContent=`${S.pdfPage} / ${S.pdfTotal}`;
          document.getElementById('save-pdf-btn').style.display='inline-flex';
          if(window.__STUDENT__&&CFG.webhookUrl) document.getElementById('submit-pdf-btn').style.display='flex';
        }
        if(pendingPdfPage) { // 자동저장 복구가 뷰어를 기다리던 쪽 → 이제 그 쪽 배경을 연다
          const p=pendingPdfPage; pendingPdfPage=0;
          renderPDFPage(p).then(()=>redraw()).catch(()=>{}).finally(()=>{pageBusy=false;});
        }
      }).catch(()=>{
        pdfLoadFailed=true;
        toast('PDF 뷰어를 불러오지 못했어요 — 1페이지만 사용할 수 있습니다');
        if(pendingPdfPage) { // 기다리던 쪽을 열 수 없음 → 1쪽으로 (그 쪽 필기는 저장본에 보존)
          pendingPdfPage=0; S.pdfPage=1;
          S.ops=cloneOpsState(S.pdfOps[1]||[]); S.opsCw=(S.pdfDims[1]&&S.pdfDims[1].cw)||0;
          rescaleOpsToCanvas(); redraw(); pageBusy=false;
        }
      });
    } else { loadSrc(window.__IMG__); }
  }
  else {const p=new URLSearchParams(location.search).get('img');if(p){S.imgUrl=p;loadExtUrl(p);}}

  // Student mode
  if(window.__STUDENT__) {
    document.getElementById('deploy-btn').style.display='none';
    document.getElementById('settings-btn').style.display='none';
    document.getElementById('share-btn').style.display='none';
    if(CFG.webhookUrl) {
      document.getElementById('submit-img-btn').style.display='flex';
      if(S.pdfDoc) document.getElementById('submit-pdf-btn').style.display='flex';
    }
  }
};

// ── Sticker Panel ─────────────────────────────────────────────────
function buildStkPanel() {
  const tabsEl = document.getElementById('sp-tabs');
  tabsEl.innerHTML = '';
  STK_CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'sp-tab' + (cat.id===curCat?' on':'');
    b.textContent = cat.label;
    b.onclick = () => switchStkCat(cat.id);
    tabsEl.appendChild(b);
  });
  renderStkRow();
}

function switchStkCat(id) {
  curCat = id;
  document.querySelectorAll('.sp-tab').forEach((b,i)=>b.classList.toggle('on', STK_CATS[i].id===id));
  renderStkRow();
}

function renderStkRow() {
  const row = document.getElementById('sp-row');
  row.innerHTML = '';
  const cat = STK_CATS.find(c=>c.id===curCat);
  if(!cat) return;

  if(curCat === 'custom') {
    // Add button
    const add = document.createElement('div');
    add.className = 'sk sk-add'; add.textContent = '+'; add.title='이미지 추가';
    add.onclick = () => document.getElementById('stk-fi').click();
    row.appendChild(add);
    CUSTOM_STKS.forEach((cs,i) => {
      const el = document.createElement('div');
      el.className = 'sk';
      const img = document.createElement('img');
      img.className = 'sk-img'; img.src = cs.src;
      el.appendChild(img);
      el.onclick = () => pickStk(el, null, cs.src);
      if(S.selStk && S.selStk.src === cs.src) el.classList.add('on');

    });

    cat.items.forEach(em => {

function pickStk(el, emoji, imgSrc) {
  S.selStk = {emoji, src: imgSrc};
  document.querySelectorAll('.sk').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  toast('캔버스를 탭해서 붙이세요!');
}

function addCustomSticker(file) {
  const r = new FileReader();
  r.onload = e => {
    const src = e.target.result;
    const img = new Image();
    img.onload = () => {
      IMG_CACHE[src] = img;
      CUSTOM_STKS.push({src, img});
      switchStkCat('custom');
      pickStk({classList:{add:()=>{},toggle:()=>{},remove:()=>{}}}, null, src);
      renderStkRow();
      toast('커스텀 스티커 추가됨!');
    };
    img.src = src;
  };

}

// ── Tabs (upload screen) ──────────────────────────────────────────
function switchTab(t) {

// ── Load ─────────────────────────────────────────────────────────
async function loadFile(f) {
  if(f.type==='application/pdf' || f.name.toLowerCase().endsWith('.pdf')) {
    loadPDF(f); return;
  }
  const r = new FileReader();
  r.onload = e => { S.src=e.target.result; S.imgUrl=null; loadSrc(e.target.result); };
  r.readAsDataURL(f);
}

async function loadPDF(file) {
  toast('PDF 불러오는 중...');
  try {
    await ensurePDFJS();
    const ab = await file.arrayBuffer();
    S.pdfSrc = 'data:application/pdf;base64,' + arrayBufferToBase64(ab);
    const pdf = await pdfjsLib.getDocument({data: ab}).promise;
    S.pdfDoc = pdf; S.pdfTotal = pdf.numPages; S.pdfPage = 1;
    await renderPDFPage(1);
  } catch(e) {
    toast('PDF를 열 수 없어요 — 인터넷 연결 또는 파일을 확인해 주세요');
  }
}
function arrayBufferToBase64(ab) {
  const bytes = new Uint8Array(ab); const chunks = []; const sz = 8192;
  for(let i=0;i<bytes.length;i+=sz) chunks.push(String.fromCharCode(...bytes.subarray(i,i+sz)));
  return btoa(chunks.join(''));
}
async function loadPDFFromSrc(dataUrl) {
  await ensurePDFJS();
  const b64 = dataUrl.split(',')[1];
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const pdf = await pdfjsLib.getDocument({data:bytes}).promise;
  S.pdfDoc=pdf; S.pdfTotal=pdf.numPages; return pdf;
}

async function renderPDFPage(pageNum) {
  if(!S.pdfDoc) return;
  const page = await S.pdfDoc.getPage(pageNum);
  // scale 3: 확대(줌) 시에도 글자가 선명하도록 고해상도로 렌더
  const viewport = page.getViewport({scale: 3});
  const tmpC = document.createElement('canvas');
  tmpC.width = viewport.width; tmpC.height = viewport.height;
  await page.render({canvasContext: tmpC.getContext('2d'), viewport}).promise;
  S.src = tmpC.toDataURL('image/png');
  S.imgUrl = null;
  S.pdfPage = pageNum;
  await loadSrc(S.src); // 새 배경이 화면에 실제로 준비될 때까지 기다림 (페이지 전환 잠금이 이 시점까지 유지되도록)
  // Show page nav if multi-page
  const nav = document.getElementById('pdf-nav');
  if(S.pdfTotal > 1) {
    nav.style.display = 'flex';
    document.getElementById('pdf-page-label').textContent = `${S.pdfPage} / ${S.pdfTotal}`;
    document.getElementById('save-pdf-btn').style.display = 'inline-flex';
    if(window.__STUDENT__&&CFG.webhookUrl) document.getElementById('submit-pdf-btn').style.display='flex';
  }
}

function changePDFPage(delta) {
  if(!S.pdfDoc){toast('PDF 로딩 중... 잠시 후 다시 시도하세요');return;}
  if(pageBusy) return; // 페이지 여는 중 연타 무시 — 예전엔 두 번째 탭이 빈 다음 쪽 필기를 앞 쪽에 덮어써 필기가 사라졌음
  const prev = S.pdfPage;
  const next = prev + delta;
  if(next < 1 || next > S.pdfTotal) return;
  // 현재 페이지 메모 저장
  rememberCurrentPDFPage();
  saveDraftNow();
  // 쪽 번호와 필기를 '동시에' 교체 — 렌더링 도중 예약된 자동저장이 돌아도 새 쪽 필기가 옛 쪽에 덮어써지지 않음
  S.pdfPage = next;
  S.ops = cloneOpsState(S.pdfOps[next] || []);
  S.opsCw = (S.pdfDims[next]&&S.pdfDims[next].cw)||0;
  S.hist=[]; S.future=[]; S.histBefore=null;
  S.selI=-1; S.selList=[]; S.dragI=-1;
  document.getElementById('pdf-page-label').textContent=`${next} / ${S.pdfTotal}`;
  pageBusy=true;
  dx.clearRect(0,0,S.cw,S.ch); pctx.clearRect(0,0,S.cw,S.ch); // 옛 배경 위에 다른 쪽 필기가 비치지 않게
  renderPDFPage(next)
    .then(()=>scheduleDraftSave())
    .catch(()=>{ // 렌더 실패 → 원래 쪽으로 되돌림 (필기 손실 없음)
      rememberCurrentPDFPage();
      S.pdfPage=prev; S.ops=cloneOpsState(S.pdfOps[prev]||[]); S.opsCw=(S.pdfDims[prev]&&S.pdfDims[prev].cw)||0;
      document.getElementById('pdf-page-label').textContent=`${prev} / ${S.pdfTotal}`;
      rescaleOpsToCanvas(); redraw(); toast('페이지를 열지 못했어요 — 다시 시도해 주세요');
    })
    .finally(()=>{ pageBusy=false; });
  toast(`${next} / ${S.pdfTotal} 페이지`);
}
// 페이지 여는 중에는 저장·제출·배포를 잠시 막음 (배경과 필기가 다른 쪽인 상태로 만들어지는 것 방지)
function pageSwitching() {
  if(!pageBusy) return false;
  toast('페이지를 여는 중이에요 — 잠시 후 다시 눌러 주세요');
  return true;
}

async function ensurePDFJS() {
  if(window.pdfjsLib) return;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

function loadDrive() {
  const raw=document.getElementById('drive-in').value.trim();
  const m=raw.match(/\/d\/([a-zA-Z0-9_-]+)/)||raw.match(/id=([a-zA-Z0-9_-]+)/);
  if(!m){toast('Google Drive 링크를 확인해 주세요');return;}
  const url=`https://lh3.googleusercontent.com/d/${m[1]}=s0`;
  S.imgUrl=url; loadExtUrl(url);
}
function loadUrl() {
  const u=document.getElementById('url-in').value.trim();
  if(u){S.imgUrl=u;loadExtUrl(u);}
}
function loadExtUrl(url) {
  toast('불러오는 중...');
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{S._tainted=false;setup(img);};
  img.onerror=()=>{
    const img2=new Image();
    img2.onload=()=>{S._tainted=true;setup(img2);};
    img2.onerror=()=>toast('이미지를 불러올 수 없어요. 파일로 업로드해 보세요.');
    img2.src=url;
  };
  img.src=url;
}
function showFatal(msg, detail) {
  try {
    const upload=document.getElementById('upload');
    const bar=document.getElementById('bar');
    const ca=document.getElementById('ca');
    if(bar) bar.style.display='none';
    if(ca) ca.style.display='none';
    if(upload) {
      upload.style.display='flex';
      upload.innerHTML =
        '<div class="u-logo">!</div>'+
        '<div class="u-title">학습지를 표시할 수 없어요</div>'+
        '<div class="u-sub">'+msg+'<br><small>'+String(detail||'')+'</small></div>'+
        '<div class="hint">Chrome을 최신 버전으로 업데이트하거나 다른 태블릿/PC에서 다시 열어 주세요. 계속 검은 화면이면 선생님께 이 화면을 보여 주세요.</div>';
    } else {
      alert(msg + (detail ? '\n' + detail : ''));
    }
  } catch(_) {}
}
// 전역 오류는 토스트 알림만 — 화면 교체(showFatal)는 이미지 디코딩·캔버스 생성 등 명시적 실패 지점에서만.
// (패들렛 등 외부 사이트가 미리보기 프레임에 끼워 넣는 스크립트 오류로 학습지 화면이 지워지는 것 방지)
window.addEventListener('error', e=>{
  if(S.img) toast('⚠️ 오류가 발생했어요: '+((e&&e.message)||'알 수 없음'));
});
window.addEventListener('unhandledrejection', e=>{
  const msg=e&&e.reason&&e.reason.message?e.reason.message:(e&&e.reason);
  if(S.img) toast('⚠️ 오류가 발생했어요: '+(msg||'알 수 없음'));
});
// 화면 준비(setup)까지 끝나면 resolve — 페이지 전환이 '새 배경이 실제로 뜬 뒤'에 잠금을 풀 수 있도록
function loadSrc(src) {
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{S._tainted=false;setup(img);res();};
    img.onerror=()=>{showFatal('내장된 학습지 이미지를 불러오지 못했습니다.', '이미지 디코딩 실패');res();};
    img.src=src;
  });
}

function setup(img) {
  try {
    S.img=img; S.nw=img.naturalWidth||img.width; S.nh=img.naturalHeight||img.height;
    if(!S.nw||!S.nh) throw new Error('이미지 크기를 읽을 수 없음');
    document.getElementById('upload').style.display='none';
    document.getElementById('bar').style.display='flex';
    document.getElementById('ca').style.display='flex';
    if(S._tainted) toast('⚠️ 이 이미지는 보안 제한으로 저장·제출이 안 돼요. 파일 업로드 방식을 권장합니다');
    applySize();
    restoreDraftIfAvailable();
    scheduleDraftSave();
    window.addEventListener('resize',applySize);
  } catch(e) {
    showFatal('태블릿에서 학습지 화면을 준비하는 중 오류가 났습니다.', e&&e.message);
  }
}
// 화면 크기 변경(태블릿 회전·창 크기 조절) 시 필기 좌표·굵기를 새 캔버스 크기 비율로 보정
function scaleOpsList(ops,r) {
  if(!Array.isArray(ops)||!ops.length||Math.abs(r-1)<0.0005) return;
  ops.forEach(op=>{
    if(op.type==='path'||op.type==='erase'){(op.pts||[]).forEach(p=>{p.x*=r;p.y*=r;});op.lw*=r;}
    else if(op.type==='line'||op.type==='curve'){op.x1*=r;op.y1*=r;op.x2*=r;op.y2*=r;if(op.type==='curve'){op.cx*=r;op.cy*=r;}op.lw*=r;}
    else if(op.type==='sticker'){op.x*=r;op.y*=r;op.size*=r;}
    else if(op.type==='text'){op.x*=r;op.y*=r;op.fs*=r;}
  });
}
function rescaleOpsToCanvas() {
  if(!S.cw) return;
  if(S.opsCw&&Math.abs(S.cw-S.opsCw)>0.5) {
    const r=S.cw/S.opsCw;
    scaleOpsList(S.ops,r);
    // 기록 항목: 전체 사본(배열)은 통째로, '다시 실행' 대기 중인 추가 항목은 그 획만 보정 (append 표시는 좌표 없음)
    const scaleEntry=h=>{ if(Array.isArray(h)) scaleOpsList(h,r); else if(h&&h.op) scaleOpsList([h.op],r); };
    S.hist.forEach(scaleEntry);
    S.future.forEach(scaleEntry);
    if(Array.isArray(S.histBefore)) scaleOpsList(S.histBefore,r);
  }
  S.opsCw=S.cw;
}
function applySize() {
  if(!S.img) return;
  const sc=Math.min((caEl.clientWidth-16)/S.nw,(caEl.clientHeight-16)/S.nh,2);
  S.cw=Math.floor(S.nw*sc); S.ch=Math.floor(S.nh*sc);
  rescaleOpsToCanvas();
  document.getElementById('cw').style.cssText=`width:${S.cw}px;height:${S.ch}px`;
  bc.style.cssText=`display:block;width:${S.cw}px;height:${S.ch}px`;
  dc.style.cssText=`position:absolute;top:0;left:0;width:${S.cw}px;height:${S.ch}px;z-index:1;touch-action:none`;
  pc.style.cssText=`position:absolute;top:0;left:0;width:${S.cw}px;height:${S.ch}px;z-index:2;pointer-events:none`;
  S.panX=Math.round((caEl.clientWidth-S.cw)/2);
  S.panY=Math.round((caEl.clientHeight-S.ch)/2);
  S.zoom=1;
  applyTransform();
  if(S.pdfDoc&&S.pdfPage) S.pdfDims[S.pdfPage]={cw:S.cw,ch:S.ch};
  QF=0; refreshQuality(); // 버퍼 생성 + 배경 그리기 + redraw
  if(textEditorSync) textEditorSync(); // 열려 있는 텍스트 입력창을 새 캔버스 크기에 맞춰 이동
}
// 캔버스 버퍼 배율 변경: 좌표계(CSS px)는 그대로, 내부 해상도만 q배로
function setQuality(q) {
  if(!S.cw||!S.ch) return;
  // 저사양 판정: 최신 크롬은 개인정보 보호로 기종명을 UA에서 지워('Android 10; K') 문자열 판정이 거의 안 맞음
  // → 기기 메모리(navigator.deviceMemory, GB)를 우선 사용, UA 판정은 구형 브라우저용으로 유지
  const lowMem=(navigator.deviceMemory>0&&navigator.deviceMemory<=4)||/Android [4-8]\.|SM-T|Lenovo|K10|A7|Tab/i.test(navigator.userAgent||'');
  q=Math.max(1,Math.min(q,lowMem?2:4,4096/S.cw,4096/S.ch));
  if(Math.abs(q-QF)<0.05&&Math.abs(q-DQF)<0.05) return;
  QF=q;
  DQF=q;
  try {
    [bc,dc,pc].forEach(c=>{c.width=Math.round(S.cw*q);c.height=Math.round(S.ch*q);});
    bx.setTransform(q,0,0,q,0,0); dx.setTransform(q,0,0,q,0,0); pctx.setTransform(q,0,0,q,0,0);
    try{bx.imageSmoothingQuality='high';dx.imageSmoothingQuality='high';}catch(_){}
    bx.clearRect(0,0,S.cw,S.ch);
    bx.drawImage(S.img,0,0,S.cw,S.ch);
    redraw();
  } catch(e) {
    if(q>1.01) { QF=0; DQF=0; setQuality(1); return; }
    showFatal('이 태블릿에서 캔버스 화면을 만들 수 없습니다.', e&&e.message);
  }
}
function setInkQuality(q) {
  if(!S.cw||!S.ch) return;
  q=Math.max(1,Math.min(q,4,4096/S.cw,4096/S.ch));
  if(Math.abs(q-DQF)<0.05) return;
  DQF=q;
  [dc,pc].forEach(c=>{c.width=Math.round(S.cw*q);c.height=Math.round(S.ch*q);});
  dx.setTransform(q,0,0,q,0,0); pctx.setTransform(q,0,0,q,0,0);
  redraw();
}
function setPreviewQuality(q) {
  if(!S.cw||!S.ch) return;
  q=Math.max(1,Math.min(q,4,4096/S.cw,4096/S.ch));
  const w=Math.round(S.cw*q), h=Math.round(S.ch*q);
  if(pc.width!==w||pc.height!==h){pc.width=w;pc.height=h;} // 같은 크기면 버퍼 재할당 생략
  pctx.setTransform(q,0,0,q,0,0);
}
function previewQuality() {
  // 미리보기(현재 긋는 획) 레이어를 잉크 레이어와 같은 해상도로 → 필기 순간 흐릿함 방지
  if(DQF) return DQF;
  const dpr=window.devicePixelRatio||1;
  return Math.max(1.5, Math.min(2.5, dpr));
}
// 현재 줌 수준에 맞춰 선명하게 재렌더 (줌 제스처 종료 시 호출)
function refreshQuality() {
  const dpr=window.devicePixelRatio||1;
  setQuality(Math.max(dpr,dpr*S.zoom));
}
function applyTransform() {
  dcRect=null; // 캔버스 위치 변경 → 좌표 캐시 무효화
  const cw=document.getElementById('cw');
  const px=Math.round(S.panX), py=Math.round(S.panY);
  if(S.zoom<=1.001) {
    // zoom=1: CSS transform 없이 left/top 으로 픽셀 정렬 (GPU 컴포지팅 블러 방지)
    cw.style.transform='';
    cw.style.left=px+'px'; cw.style.top=py+'px';
  } else {
    // zoom>1: translate3d + scale (transform-origin:0 0)
    cw.style.left='0'; cw.style.top='0';
    cw.style.transform=`translate3d(${px}px,${py}px,0) scale(${S.zoom})`;
  }
  const zi=document.getElementById('zoom-ind');
  if(zi){const v=S.zoom>1.01;zi.style.display=v?'inline-block':'none';if(v)zi.textContent=`🔍 ${Math.round(S.zoom*100)}%`;}
}
function clampPan() {
  const vw=S.cw*S.zoom, vh=S.ch*S.zoom;
  S.panX=Math.max(caEl.clientWidth*.1-vw, Math.min(caEl.clientWidth*.9,  S.panX));
  S.panY=Math.max(caEl.clientHeight*.1-vh, Math.min(caEl.clientHeight*.9, S.panY));
}
function resetZoom() {
  S.zoom=1;
  S.panX=Math.round((caEl.clientWidth-S.cw)/2);
  S.panY=Math.round((caEl.clientHeight-S.ch)/2);

}

// ── Mode / Color ──────────────────────────────────────────────────
function setMode(m) {

  // 모드 전환 시 모든 제스처 상태 초기화 (PTRS 잔여 항목으로 인한 먹통 방지)

  document.querySelectorAll('.tb[id^="m-"]').forEach(b=>b.classList.remove('on','on-red'));
  const btn=document.getElementById('m-'+m); if(btn)btn.classList.add(m==='erase'?'on-red':'on');
  document.getElementById('sp').style.display=m==='sticker'?'block':'none';
  document.getElementById('colg').style.display=(m==='erase'||m==='sticker'||m==='pan'||m==='select')?'none':'flex';
  document.getElementById('szr-wrap').style.display=(m==='draw'||m==='erase'||m==='line'||m==='curve')?'flex':'none';
  document.getElementById('fsg').style.display=m==='text'?'flex':'none';
  // 도구별 굵기 복원: 지우개↔펜 전환 시 각자 기억한 값으로 (슬라이더·점 표시 동기화)
  if(m==='draw'||m==='line'||m==='curve'||m==='erase') {

  dc.style.cursor={draw:'crosshair',select:'default',line:'crosshair',curve:'crosshair',erase:'cell',sticker:'copy',text:'text',pan:'grab'}[m]||'default';
  toast({draw:'🖌️ 필기',select:'☝️ 선택',line:'／ 직선',curve:'⌒ 곡선',erase:'🧽 지우개',sticker:'⭐ 스티커',text:'T 텍스트',pan:'✋ 손가락으로 드래그해서 이동'}[m]||'');
  redraw();
}
function setCol(el) {

// 슬라이더 → 현재 도구의 굵기 슬롯에 저장 (지우개/펜 계열 각각 기억)

// 굵기 미리보기 갱신: 점 지름 = 실제 선 굵기(px). 너무 얇으면 최소 2px로만 표시.
// 지우개 모드는 회색 점, 그 외에는 현재 펜 색으로 크기+색을 한눈에.
function updateSizeLabel() {

// ── Pointer ───────────────────────────────────────────────────────
function gp(e) {const r=dcRect||(dcRect=dc.getBoundingClientRect());return{x:(e.clientX-r.left)/S.zoom,y:(e.clientY-r.top)/S.zoom};}
function stkAt(x,y) {
  for(let i=S.ops.length-1;i>=0;i--) {
    const o=S.ops[i];
    if(o.type==='sticker'){const h=o.size/2;if(x>=o.x-h&&x<=o.x+h&&y>=o.y-h&&y<=o.y+h)return i;}
  }
  return -1;
}
function textAt(x,y) {
  for(let i=S.ops.length-1;i>=0;i--) {
    const o=S.ops[i];
    if(o.type==='text'&&opHit(o,x,y)) return i;
  }
  return -1;
}
function rotPoint(x,y,cx,cy,a){const s=Math.sin(a),c=Math.cos(a),dxv=x-cx,dyv=y-cy;return{x:cx+dxv*c-dyv*s,y:cy+dxv*s+dyv*c};}
function boundsFromPoints(pts){let x1=pts[0].x,y1=pts[0].y,x2=x1,y2=y1;pts.forEach(p=>{x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y);});return{x1,y1,x2,y2};}
function rotatedRectBounds(x1,y1,x2,y2,cx,cy,a){return boundsFromPoints([{x:x1,y:y1},{x:x2,y:y1},{x:x2,y:y2},{x:x1,y:y2}].map(p=>rotPoint(p.x,p.y,cx,cy,a||0)));}
function textMetrics(op){
  dx.font=`bold ${op.fs}px sans-serif`;
  const lines=String(op.text||'').split('\n');
  let w=0; for(const ln of lines){const lw=dx.measureText(ln).width; if(lw>w)w=lw;}
  return {lines,n:lines.length,w,lh:op.fs*1.4};
}
function opBounds(op) {

  if(op.type==='text') {
    const m=textMetrics(op), h=op.fs*1.4;
    return rotatedRectBounds(op.x,op.y-h,op.x+m.w,op.y+(m.n-1)*m.lh+6,op.x,op.y,op.angle||0);
  }
  if(op.type==='line') {
    const pad=Math.max(8,op.lw+6);
    return {x1:Math.min(op.x1,op.x2)-pad,y1:Math.min(op.y1,op.y2)-pad,x2:Math.max(op.x1,op.x2)+pad,y2:Math.max(op.y1,op.y2)+pad};
  }
  if(op.type==='curve') {
    const pad=Math.max(8,op.lw+6);
    return {x1:Math.min(op.x1,op.x2,op.cx)-pad,y1:Math.min(op.y1,op.y2,op.cy)-pad,x2:Math.max(op.x1,op.x2,op.cx)+pad,y2:Math.max(op.y1,op.y2,op.cy)+pad};
  }
  if(op.type==='path'||op.type==='erase') {
    const pts=op.pts||[]; if(!pts.length) return null;
    const pad=Math.max(8,op.lw+6);
    let x1=pts[0].x,y1=pts[0].y,x2=x1,y2=y1;
    pts.forEach(p=>{x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y);});
    return {x1:x1-pad,y1:y1-pad,x2:x2+pad,y2:y2+pad};
  }
  return null;
}
function distToSeg(px,py,ax,ay,bx,by) {
  const dx=bx-ax, dy=by-ay, len=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len));
  const x=ax+t*dx, y=ay+t*dy;
  return Math.hypot(px-x,py-y);
}
function opHit(op,x,y) {
  const b=opBounds(op); if(!b||x<b.x1||x>b.x2||y<b.y1||y>b.y2) return false;
  if(op.type==='path'||op.type==='erase') {
    const pts=op.pts||[], lim=Math.max(12,op.lw+8);
    for(let i=1;i<pts.length;i++) if(distToSeg(x,y,pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y)<=lim) return true;
    return pts.length===1&&Math.hypot(x-pts[0].x,y-pts[0].y)<=lim;
  }
  if(op.type==='line') return distToSeg(x,y,op.x1,op.y1,op.x2,op.y2)<=Math.max(12,op.lw+8);

function opAt(x,y) {
  for(let i=S.ops.length-1;i>=0;i--) if(opHit(S.ops[i],x,y)) return i;
  return -1;
}
function normBox(b){return{x1:Math.min(b.x1,b.x2),y1:Math.min(b.y1,b.y2),x2:Math.max(b.x1,b.x2),y2:Math.max(b.y1,b.y2)};}
function boxesOverlap(a,b){a=normBox(a);b=normBox(b);return a.x1<=b.x2&&a.x2>=b.x1&&a.y1<=b.y2&&a.y2>=b.y1;}
function selectedBounds() {
  const ids=(S.selList&&S.selList.length)?S.selList:(S.selI>=0?[S.selI]:[]);
  let out=null;
  ids.forEach(i=>{const b=opBounds(S.ops[i]); if(!b)return; out=out?{x1:Math.min(out.x1,b.x1),y1:Math.min(out.y1,b.y1),x2:Math.max(out.x2,b.x2),y2:Math.max(out.y2,b.y2)}:b;});
  return out;
}
function drawLasso() {

  pctx.save();
  pctx.fillStyle='rgba(79,70,229,.08)';
  pctx.strokeStyle='#4f46e5';
  pctx.lineWidth=1.5;
  pctx.setLineDash([5,4]);
  pctx.fillRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);

}
function shapeHandleAt(x,y) {
  if(S.selI<0||S.selI>=S.ops.length) return null;
  const op=S.ops[S.selI], pts=[];
  if(op.type==='line') pts.push(['p1',op.x1,op.y1],['p2',op.x2,op.y2]);
  else if(op.type==='curve') pts.push(['p1',op.x1,op.y1],['c',op.cx,op.cy],['p2',op.x2,op.y2]);
  for(const [id,hx,hy] of pts) if(Math.abs(x-hx)<=18&&Math.abs(y-hy)<=18) return id;
  return null;
}
function groupResizeHandleAt(x,y) {
  const b=selectedBounds(); if(!b) return false;
  return Math.abs(x-(b.x2+6))<=18&&Math.abs(y-(b.y2+6))<=18;
}
function rotateHandleAt(x,y) {
  const b=selectedBounds(); if(!b) return false;
  const hx=(b.x1+b.x2)/2, hy=b.y1-30;
  return Math.abs(x-hx)<=18&&Math.abs(y-hy)<=18;
}
function moveOp(op,dxv,dyv) {
  if(op.type==='path'||op.type==='erase') (op.pts||[]).forEach(p=>{p.x+=dxv;p.y+=dyv;});
  else if(op.type==='line'||op.type==='curve') {op.x1+=dxv;op.y1+=dyv;op.x2+=dxv;op.y2+=dyv;if(op.type==='curve'){op.cx+=dxv;op.cy+=dyv;}}

}
function cloneOps(ids){return ids.map(i=>JSON.parse(JSON.stringify(S.ops[i])));}
function restoreClones(ids,clones){ids.forEach((i,k)=>{S.ops[i]=JSON.parse(JSON.stringify(clones[k]));});}
function rotateOp(op,center,angle) {
  const rp=p=>rotPoint(p.x,p.y,center.x,center.y,angle);
  if(op.type==='path'||op.type==='erase') (op.pts||[]).forEach(p=>{const q=rp(p);p.x=q.x;p.y=q.y;});
  else if(op.type==='line'||op.type==='curve') {
    let q=rp({x:op.x1,y:op.y1}); op.x1=q.x; op.y1=q.y;
    q=rp({x:op.x2,y:op.y2}); op.x2=q.x; op.y2=q.y;
    if(op.type==='curve'){q=rp({x:op.cx,y:op.cy}); op.cx=q.x; op.cy=q.y;}

function scaleOp(op,box,sx,sy) {
  const map=p=>({x:box.x1+(p.x-box.x1)*sx,y:box.y1+(p.y-box.y1)*sy});
  const lf=(Math.abs(sx)+Math.abs(sy))/2; // 크기 조절 시 선 굵기도 같은 비율로 (축소 시 선만 굵어 보이는 문제 방지)
  if(op.type==='path'||op.type==='erase') {(op.pts||[]).forEach(p=>{const q=map(p);p.x=q.x;p.y=q.y;});op.lw=Math.max(0.25,op.lw*lf);}
  else if(op.type==='line'||op.type==='curve') {
    let q=map({x:op.x1,y:op.y1}); op.x1=q.x; op.y1=q.y;
    q=map({x:op.x2,y:op.y2}); op.x2=q.x; op.y2=q.y;
    if(op.type==='curve'){q=map({x:op.cx,y:op.cy}); op.cx=q.x; op.cy=q.y;}
    op.lw=Math.max(0.25,op.lw*lf);
  } else if(op.type==='sticker') {
    const q=map({x:op.x,y:op.y}); op.x=q.x; op.y=q.y; op.size=Math.max(12,op.size*Math.max(sx,sy));
  } else if(op.type==='text') {
    const q=map({x:op.x,y:op.y}); op.x=q.x; op.y=q.y; op.fs=Math.max(8,op.fs*Math.max(sx,sy));
  }
}
function resizeHandleAt(x,y) {
  if(S.selI<0||S.selI>=S.ops.length) return false;
  const b=opBounds(S.ops[S.selI]); if(!b) return false;
  const hx=b.x2+6, hy=b.y2+6;
  return Math.abs(x-hx)<=16&&Math.abs(y-hy)<=16;
}
// 진행 중인 동작 종료 (활성 포인터 해제)
function endAction() {
  S.down=false; S.dragI=-1; S.resizing=false; S.rotating=false; S.shapeHandle=null; S.rbox=null; S.rotCenter=null; activeId=null;
  if(pctx&&S.cw) pctx.clearRect(0,0,S.cw,S.ch); // 예측 잉크 미리보기 제거

}
function pd(e) {
