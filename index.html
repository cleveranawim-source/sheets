  // 이 탭은 '입력 끝내기'로만 쓰고 여기서 멈춤 (예전엔 끝내려고 누른 자리에 빈 글상자가 또 열렸음)
  const ted=document.querySelector('#cw textarea');
  if(ted) { ted.blur(); return; }
  if(pageBusy) return; // 페이지 여는 중에는 필기 시작 금지 (옛 배경 위에 다른 쪽 필기가 섞이지 않게)
  dcRect=null; // 제스처 시작마다 캔버스 위치 1회 재측정 (이후 move에서는 캐시 사용)
  rawSeen=false;

  if(e.pointerType==='pen'){penSeen=true;penLastT=performance.now();}
  // 펜으로 긋는 중에 닿는 손가락·손바닥은 완전히 무시.
  // 예전엔 손바닥이 두 군데 닿으면 '두 손가락 확대'로 오인해, 긋고 있던 펜 획을 지우고 멈춰 버렸음 (아이패드에서 획이 뚝 끊기는 원인)
  if(e.pointerType==='touch'&&activeId!==null&&PTRS.has(activeId)&&PTRS.get(activeId).t==='pen') return;
  // 펜 우선: 펜이 닿는 순간 손바닥(터치) 포인터 전부 무효화
  if(e.pointerType==='pen') {
    let hadTouch=false;
    for(const [id,p] of [...PTRS]) if(p.t==='touch'){PTRS.delete(id);hadTouch=true;}
    if(hadTouch) {
      // 손바닥이 먼저 닿아 시작된 가짜 획 제거
      if(S.down&&(S.mode==='draw'||S.mode==='erase')&&S.ops.length){S.ops.pop();cancelHistory();}
      endAction(); zooming=false; redraw();
    }
  }

  PTRS.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.pointerType});
  try{dc.setPointerCapture(e.pointerId);}catch(_){}

  // 유령 활성 포인터 정리: activeId가 이미 사라진 포인터를 가리키면 해제 (영구 먹통 방지)
  if(activeId!==null&&!PTRS.has(activeId)) endAction();

  // 두 손가락(터치만) → 핀치 확대. 막 시작된 획은 취소
  const tpts=[...PTRS.values()].filter(p=>p.t==='touch');
  if(tpts.length>=2) {
    if(S.down&&(S.mode==='draw'||S.mode==='erase')&&S.ops.length){S.ops.pop();cancelHistory();redraw();}
    endAction();
    const caR=caEl.getBoundingClientRect();
    zoomCaLeft=caR.left; zoomCaTop=caR.top;
    zoomDist0=Math.hypot(tpts[1].x-tpts[0].x,tpts[1].y-tpts[0].y)||1;
    zoomZoom0=S.zoom;
    const midX=(tpts[0].x+tpts[1].x)/2, midY=(tpts[0].y+tpts[1].y)/2;
    zoomCanvasX=(midX-zoomCaLeft-S.panX)/S.zoom;
    zoomCanvasY=(midY-zoomCaTop-S.panY)/S.zoom;
    zooming=true;
    return;
  }
  if(zooming) return;            // 핀치 중 새 동작 시작 금지
  if(activeId!==null) return;    // 이미 다른 포인터가 동작 중 (펜 필기 중 손바닥 등)
  if(PTRS.size>=2) return;       // 혼합(펜+터치) 상태 → 새 동작 금지
  // 손바닥 보호: 펜 사용 중에는 손가락 단독 터치로 그리기/지우기/도형 시작 금지
  if(penSeen&&e.pointerType==='touch'&&(S.mode==='draw'||S.mode==='erase'||S.mode==='line'||S.mode==='curve')) {
    const now=performance.now();
    if(now-penLastT>30000){ penSeen=false; toast('✍️ 손가락 필기를 다시 켰어요'); } // 펜 30초 미사용 → 자동 해제 (펜 분실·방전 대비)
    else {
      if(now-fingerHintT>15000){ fingerHintT=now; toast('펜 사용 중엔 손가락 필기가 잠겨요 (펜을 30초 쉬면 풀림)'); } // 손바닥 오작동 방지 — 안내는 15초에 한 번만
      return;
    }
  }

  const{x,y}=gp(e);
  S.down=true; activeId=e.pointerId;
  if(S.mode==='pan') {
    S.dox=e.clientX-S.panX; S.doy=e.clientY-S.panY;
    dc.style.cursor='grabbing';
  } else if(S.mode==='select') {
    if(rotateHandleAt(x,y)) {
      const ids=(S.selList&&S.selList.length)?S.selList:[S.selI];
      const b=selectedBounds();
      beginHistory();
      S.rotating=true; S.rso=cloneOps(ids); S.rbox=b; S.rotCenter={x:(b.x1+b.x2)/2,y:(b.y1+b.y2)/2};
      S.rotStart=Math.atan2(y-S.rotCenter.y,x-S.rotCenter.x);
      dc.style.cursor='grabbing';
      return;
    }
    const h=shapeHandleAt(x,y);
    if(h){beginHistory();S.shapeHandle=h; S.selI=S.selI; redraw(); return;}
    if(((S.selList&&S.selList.length>1)&&groupResizeHandleAt(x,y)) || (S.selI>=0&&resizeHandleAt(x,y))) {
      const ids=(S.selList&&S.selList.length)?S.selList:[S.selI];
      beginHistory();
      S.resizing=true; S.rsx=x; S.rsy=y; S.rbox=selectedBounds(); S.rso=cloneOps(ids);
    } else {
      const i=opAt(x,y);
      if(i>=0){
        const now=performance.now();
        if(S.ops[i].type==='text'&&i===lastTapI&&now-lastTapT<400){lastTapI=-1;lastTapT=0;endAction();editText(i);return;} // 텍스트 더블탭 → 내용 수정
        lastTapI=S.ops[i].type==='text'?i:-1; lastTapT=now;
        if(!S.selList.includes(i)) S.selList=[i];
        beginHistory();
        S.dragI=i;S.selI=i;S.dox=x;S.doy=y;S.groupDrag=S.selList.length>1;dc.style.cursor='move';
      }
      else{S.selI=-1;S.selList=[];S.lasso={x1:x,y1:y,x2:x,y2:y};setPreviewQuality(previewQuality());drawLasso();}
      redraw();
    }
  } else if(S.mode==='draw'||S.mode==='erase') {
    beginHistoryAppend();
    S.ops.push({type:S.mode==='draw'?'path':'erase',color:S.color,lw:S.lw,pts:[{x:r1(x),y:r1(y)}]});
    // 닿는 즉시 점을 찍어 첫 반응을 보임 (이후 획의 둥근 캡이 자연스럽게 덮음)
    dx.save();
    dx.globalCompositeOperation=S.mode==='erase'?'destination-out':'source-over';
    dx.fillStyle=S.mode==='erase'?'#000':S.color;
    dx.beginPath(); dx.arc(x,y,S.lw/2,0,Math.PI*2); dx.fill();
    dx.restore();
  } else if(S.mode==='line'||S.mode==='curve') {
    if(rotateHandleAt(x,y)) {
      const ids=(S.selList&&S.selList.length)?S.selList:[S.selI];
      const b=selectedBounds();
      beginHistory();
      S.rotating=true; S.rso=cloneOps(ids); S.rbox=b; S.rotCenter={x:(b.x1+b.x2)/2,y:(b.y1+b.y2)/2};
      S.rotStart=Math.atan2(y-S.rotCenter.y,x-S.rotCenter.x);
      dc.style.cursor='grabbing';
      return;
    }
    const h=shapeHandleAt(x,y);
    if(h){
      beginHistory();
      S.shapeHandle=h;
      redraw();
      return;
    }
    const i=opAt(x,y);
    if(i===S.selI&&S.ops[i]&&(S.ops[i].type==='line'||S.ops[i].type==='curve')) {
      beginHistory();
      S.dragI=i;
      S.dox=x;
      S.doy=y;
      dc.style.cursor='move';
      redraw();
      return;
    }
    beginHistory();
    S.ops.push({type:S.mode,color:S.color,lw:S.lw,x1:x,y1:y,x2:x,y2:y,cx:x,cy:y});
    S.selI=S.ops.length-1; S.selList=[S.selI];
    setPreviewQuality(previewQuality());
    drawShapePreview(S.ops[S.ops.length-1]);
  } else if(S.mode==='sticker') {
    if(S.selI>=0&&resizeHandleAt(x,y)) {
      beginHistory();
      S.resizing=true; S.rsx=x; S.rsy=y; S.rso=S.ops[S.selI].size;
    } else {
      const i=stkAt(x,y);
      if(i>=0){beginHistory();S.dragI=i;S.selI=i;S.dox=x-S.ops[i].x;S.doy=y-S.ops[i].y;redraw();}
      else if(S.selStk){beginHistoryAppend();S.selI=S.ops.length;S.ops.push({type:'sticker',emoji:S.selStk.emoji,imgSrc:S.selStk.src,x,y,size:60});redraw();}
      else toast('먼저 스티커를 선택하세요');
    }
  } else if(S.mode==='text') {
    if(S.selI>=0&&resizeHandleAt(x,y)) {
      beginHistory();
      S.resizing=true; S.rsx=x; S.rsy=y; S.rso=S.ops[S.selI].fs;
    } else {
      const i=textAt(x,y);
      if(i>=0){
        const now=performance.now();
        if(i===lastTapI&&now-lastTapT<400){lastTapI=-1;lastTapT=0;endAction();editText(i);return;} // 더블탭 → 내용 수정
        lastTapI=i; lastTapT=now;
        beginHistory();S.dragI=i;S.selI=i;S.dox=x-S.ops[i].x;S.doy=y-S.ops[i].y;dc.style.cursor='move';redraw();
      }
      else{lastTapI=-1;S.selI=-1;redraw();addText(x,y);}
    }
  }
}
// pointerrawupdate 처리: 그리기/지우개 중에만, 활성 포인터의 샘플을 즉시 잉크에 반영
function rawInk(e) {
  if(!S.down||e.pointerId!==activeId||zooming) return;
  if(S.mode!=='draw'&&S.mode!=='erase') return;
  const op=S.ops[S.ops.length-1]; if(!op) return;
  rawSeen=true;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():null;
  if(CFG.fastInk&&op.type==='path') {
    if(evs&&evs.length){for(const ev of evs){if(addInkPoint(op,gp(ev),false))drawFastInkPreview(op);}}
    else if(addInkPoint(op,gp(e),false)) drawFastInkPreview(op);
  } else {
    if(evs&&evs.length){for(const ev of evs){addInkPoint(op,gp(ev));}}
    else addInkPoint(op,gp(e));
  }
}
function pm(e) {
  // 펜을 화면 위에 띄워(호버) 생각 중인 것도 '펜 사용 중' — 30초 손가락 잠금 해제 타이머를 연장 (손바닥 오작동 방지)
  if(e.pointerType==='pen'&&penSeen) penLastT=performance.now();
  const rec=PTRS.get(e.pointerId); if(!rec) return; // pd()로 등록된 포인터만 처리 (hover 오염 방지)
  rec.x=e.clientX; rec.y=e.clientY; // 객체 재사용 (매 이동마다 할당 방지)

  if(zooming) {
    const tpts=[...PTRS.values()].filter(p=>p.t==='touch');
    if(tpts.length>=2) {
      e.preventDefault();
      const midX=(tpts[0].x+tpts[1].x)/2, midY=(tpts[0].y+tpts[1].y)/2;
      const dist=Math.hypot(tpts[1].x-tpts[0].x,tpts[1].y-tpts[0].y);
      const newZoom=Math.max(1,Math.min(5,zoomZoom0*dist/zoomDist0));
      S.zoom=newZoom;
      S.panX=(midX-zoomCaLeft)-zoomCanvasX*newZoom;
      S.panY=(midY-zoomCaTop)-zoomCanvasY*newZoom;
      clampPan(); applyTransform();
    }
    return;
  }

  // 활성 포인터(동작을 시작한 그 포인터)만 필기/이동/리사이즈 가능 → 손바닥 개입 차단
  if(e.pointerId!==activeId) return;

  if(S.mode==='pan'&&S.down) {
    e.preventDefault();
    S.panX=e.clientX-S.dox; S.panY=e.clientY-S.doy;
    clampPan(); applyTransform(); return;
  }
  if((S.mode==='select'||S.mode==='line'||S.mode==='curve')&&S.rotating&&S.rotCenter&&S.rso) {
    e.preventDefault();
    const{x,y}=gp(e);
    const ids=(S.selList&&S.selList.length)?S.selList:[S.selI];
    restoreClones(ids,S.rso);
    const a=Math.atan2(y-S.rotCenter.y,x-S.rotCenter.x)-S.rotStart;
    ids.forEach(i=>rotateOp(S.ops[i],S.rotCenter,a));
    redraw(); return;
  }
  if((S.mode==='select'||S.mode==='line'||S.mode==='curve')&&S.shapeHandle&&S.selI>=0) {
    e.preventDefault();
    const{x,y}=gp(e), op=S.ops[S.selI];
    if(S.shapeHandle==='p1'){op.x1=x;op.y1=y;}
    else if(S.shapeHandle==='p2'){op.x2=x;op.y2=y;}
    else if(S.shapeHandle==='c'){op.cx=x;op.cy=y;}
    redraw(); return;
  }
  if(S.resizing&&S.selI>=0) {
    e.preventDefault();
    const{x,y}=gp(e); const op=S.ops[S.selI];
    if(S.mode==='select'&&S.rbox&&S.rso) {
      const ids=(S.selList&&S.selList.length)?S.selList:[S.selI];
      restoreClones(ids,S.rso);
      const sx=Math.max(.1,(x-S.rbox.x1)/Math.max(1,S.rbox.x2-S.rbox.x1));
      const sy=Math.max(.1,(y-S.rbox.y1)/Math.max(1,S.rbox.y2-S.rbox.y1));
      ids.forEach(i=>scaleOp(S.ops[i],S.rbox,sx,sy));
    } else {
      const delta=(x-S.rsx+y-S.rsy)/2;
      if(op.type==='sticker') op.size=Math.max(20,Math.round(S.rso+delta));
      else if(op.type==='text') op.fs=Math.max(8,Math.round(S.rso+delta));
    }
    redraw(); return;
  }
  if(!S.down) return;
  e.preventDefault();
  if(S.mode==='select'&&S.lasso){
    const{x,y}=gp(e); S.lasso.x2=x; S.lasso.y2=y; drawLasso(); return;
  }
  if((S.mode==='draw'||S.mode==='erase')&&S.ops.length){
    const op=S.ops[S.ops.length-1];
    if(op){
      // 빠른 필기 모드에서는 최신 좌표만 반영해 펜 끝을 더 즉각적으로 따라간다.
      // rawInk가 이 획의 좌표를 받고 있으면 pointermove의 병합 샘플은 같은 좌표의 재전달이므로 추가하지 않음
      // (두 경로로 중복 추가되면 획이 지나간 자리로 되돌아가는 지그재그가 생김)
      const evs=rawSeen?null:(e.getCoalescedEvents?e.getCoalescedEvents():null);
      if(CFG.fastInk&&op.type==='path') {
        if(!rawSeen){
          // 중간 샘플 전부 반영 — 빠른 필기에서도 곡선이 매끄럽게
          if(evs&&evs.length){for(const ev of evs){if(addInkPoint(op,gp(ev),false))drawFastInkPreview(op);}}
          else if(addInkPoint(op,gp(e),false)) drawFastInkPreview(op);
        }
        drawFastPrediction(op,e); // 예측 잉크: 다음 펜 위치까지 미리 그려 체감 지연 감소
      } else {
        if(!rawSeen){
          if(evs&&evs.length){for(const ev of evs){addInkPoint(op,gp(ev));}}
          else{addInkPoint(op,gp(e));}
        }
        drawLiveTip(op,e); // 예측 잉크: 미확정 구간 + 예측 위치 미리보기
      }
    }
  }
  else if((S.mode==='line'||S.mode==='curve')&&S.dragI>=0){
    const{x,y}=gp(e);
    moveOp(S.ops[S.dragI],x-S.dox,y-S.doy);
    S.dox=x;S.doy=y;
    redraw();
  }
  else if((S.mode==='line'||S.mode==='curve')&&S.ops.length){
    const op=S.ops[S.ops.length-1];
    const{x,y}=gp(e);
    op.x2=x; op.y2=y;
    if(op.type==='curve') {
      const mx=(op.x1+x)/2, my=(op.y1+y)/2;
      const dxv=x-op.x1, dyv=y-op.y1;
      op.cx=mx-dyv*0.22; op.cy=my+dxv*0.22;
    }
    drawShapePreview(op);
  }
  else if(S.mode==='select'&&S.dragI>=0){const{x,y}=gp(e);const ids=(S.groupDrag&&S.selList.length)?S.selList:[S.dragI];ids.forEach(i=>moveOp(S.ops[i],x-S.dox,y-S.doy));S.dox=x;S.doy=y;redraw();}
  else if((S.mode==='sticker'||S.mode==='text')&&S.dragI>=0){const{x,y}=gp(e);S.ops[S.dragI].x=x-S.dox;S.ops[S.dragI].y=y-S.doy;redraw();}
}
function pu(e) {
  if(e) PTRS.delete(e.pointerId);
  const tCount=[...PTRS.values()].filter(p=>p.t==='touch').length;
  if(zooming&&tCount<2) { zooming=false; refreshQuality(); } // 핀치 종료 → 선명하게 재렌더
  // 동작을 시작한 포인터가 떨어졌을 때만 동작 종료 (손바닥 떼는 것은 무시)
  if(!e || e.pointerId===activeId) {
    const changed=S.down&&(S.mode==='draw'||S.mode==='erase'||S.mode==='line'||S.mode==='curve'||S.mode==='select'||S.mode==='sticker'||S.mode==='text');
    const wasDrawing=S.down&&(S.mode==='draw'||S.mode==='erase');
    const drawnOp=wasDrawing&&S.ops.length?S.ops[S.ops.length-1]:null;
    endAction();
    if(drawnOp) finalizeStroke(drawnOp); // 전체 다시 그리기 대신 방금 그은 획만 확정 → 필기가 쌓여도 펜 뗄 때 안 끊김
    if(S.mode==='line'||S.mode==='curve') { pctx.clearRect(0,0,S.cw,S.ch); redraw(); }
    if(S.mode==='select'&&S.lasso) {
      const b=normBox(S.lasso);
      S.selList=[];
      S.ops.forEach((op,i)=>{const ob=opBounds(op); if(ob&&boxesOverlap(b,ob)) S.selList.push(i);});
      S.selI=S.selList.length?S.selList[S.selList.length-1]:-1;
      pctx.clearRect(0,0,S.cw,S.ch);
      redraw();
    }
    S.shapeHandle=null; S.rbox=null; S.lasso=null; S.groupDrag=false;
    if(changed) commitHistory();
    if(changed) scheduleDraftSave();
  }
}

// ── Draw ─────────────────────────────────────────────────────────
// 예측 잉크: 확정 잉크(중간점까지)와 실제 펜 끝 사이 + 브라우저 예측 위치를 오버레이에 표시.
// 매 이동마다 전체 클리어 후 다시 그림 → 잔상 없음. 체감 필기 지연을 크게 줄임.
let tipBox=null; // 직전 미리보기 영역 (부분 클리어용)
let inkSamples=[]; // 최근 입력 샘플(x,y,t) — 펜 속도 기반 추가 예측용
function clearTip() {
  if(tipBox) pctx.clearRect(tipBox.x,tipBox.y,tipBox.w,tipBox.h);
  else pctx.clearRect(0,0,S.cw,S.ch);
  tipBox=null;
}
function drawLiveTip(op,e) {
  clearTip(); // 전체 클리어 대신 직전 미리보기 영역만 지움 → 선명한 해상도를 유지하면서 빠름
  if(CFG.fastInk) return;
  if(op.type!=='path') return; // 지우개는 미리보기 생략
  const pts=op.pts; if(pts.length<2) return;
  const a=pts[pts.length-2], b=pts[pts.length-1];
  // 속도 추정용 샘플 기록
  inkSamples.push({x:b.x,y:b.y,t:e.timeStamp||performance.now()});
  if(inkSamples.length>4) inkSamples.shift();
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  let x1=Math.min(mx,b.x), y1=Math.min(my,b.y), x2=Math.max(mx,b.x), y2=Math.max(my,b.y);
  pctx.save();
  pctx.strokeStyle=op.color; pctx.lineWidth=op.lw; pctx.lineCap='round'; pctx.lineJoin='round';
  pctx.beginPath();
  pctx.moveTo(mx,my);   // 확정 잉크가 끝난 지점부터
  pctx.lineTo(b.x,b.y); // 실제 최신 펜 위치까지
  let ex=b.x, ey=b.y;   // 현재 미리보기 끝점
  if(e.getPredictedEvents) {             // 브라우저 예측 위치 1개
    const preds=e.getPredictedEvents();
    if(preds&&preds.length){const p=gp(preds[0]);pctx.lineTo(p.x,p.y);ex=p.x;ey=p.y;x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y);}
  }
  // 속도 기반 추가 예측(~20ms): 잉크가 펜 끝에 '딱 붙는' 느낌.
  // 오버레이에만 그리므로 틀려도 다음 프레임에 지워짐(저장본 무관). 방향 전환 시 자동 감쇠.
  const smp=inkSamples;
  if(smp.length>=2) {
    const p1=smp[smp.length-2], p2=smp[smp.length-1];
    const dt=Math.max(4, p2.t-p1.t);
    const vx=(p2.x-p1.x)/dt, vy=(p2.y-p1.y)/dt;
    let damp=1;
    if(smp.length>=3) {
      const p0=smp[smp.length-3];
      const d1x=p1.x-p0.x, d1y=p1.y-p0.y, d2x=p2.x-p1.x, d2y=p2.y-p1.y;
      const n1=Math.hypot(d1x,d1y)||1, n2=Math.hypot(d2x,d2y)||1;
      damp=Math.max(0,(d1x*d2x+d1y*d2y)/(n1*n2)); // 직전 두 구간의 방향 일치도(0~1)
    }
    const H=20*damp; // 예측 지평(ms)
    let qx=ex+vx*H, qy=ey+vy*H;
    const dist=Math.hypot(qx-ex,qy-ey);
    if(dist>30){qx=ex+(qx-ex)*30/dist;qy=ey+(qy-ey)*30/dist;} // 폭주 방지
    if(dist>0.5){
      pctx.lineTo(qx,qy);
      x1=Math.min(x1,qx);y1=Math.min(y1,qy);x2=Math.max(x2,qx);y2=Math.max(y2,qy);
    }
  }
  pctx.stroke(); pctx.restore();
  const pad=op.lw+4;
  tipBox={x:x1-pad,y:y1-pad,w:x2-x1+pad*2,h:y2-y1+pad*2};
}
function drawFastInkPreview(op) {
  const pts=op.pts; if(!pts||!pts.length) return;
  pctx.save();
  pctx.globalCompositeOperation='source-over';
  pctx.strokeStyle=op.color; pctx.fillStyle=op.color; pctx.lineWidth=op.lw; pctx.lineCap='round'; pctx.lineJoin='round';
  if(pts.length===1) {
    pctx.beginPath(); pctx.arc(pts[0].x,pts[0].y,op.lw/2,0,Math.PI*2); pctx.fill();
  } else {
    const a=pts[pts.length-2], b=pts[pts.length-1];
    pctx.beginPath(); pctx.moveTo(a.x,a.y); pctx.lineTo(b.x,b.y); pctx.stroke();
  }
  pctx.restore();
}
let predBox=null; // 직전 예측 잉크 영역 (다음 이동에서 부분 클리어)
function repaintRecentSegs(op) {
  const pts=op.pts; if(!pts||pts.length<2) return;
  const n=Math.min(pts.length-1, 8);
  pctx.save();
  pctx.strokeStyle=op.color; pctx.lineWidth=op.lw; pctx.lineCap='round'; pctx.lineJoin='round';
  pctx.beginPath();
  pctx.moveTo(pts[pts.length-1-n].x, pts[pts.length-1-n].y);
  for(let i=pts.length-n;i<pts.length;i++) pctx.lineTo(pts[i].x,pts[i].y);
  pctx.stroke(); pctx.restore();
}
// 빠른 모드 예측 잉크: 브라우저가 예측한 다음 펜 위치까지 미리 표시.
// 예측 자국은 다음 이동에서 지우고, 그 자리에 걸친 최근 확정 획을 다시 그림 (최종 저장본에는 영향 없음)
function drawFastPrediction(op,e) {
  if(predBox) {
    pctx.clearRect(predBox.x,predBox.y,predBox.w,predBox.h);
    repaintRecentSegs(op);
    predBox=null;
  }
  if(!e.getPredictedEvents) return;
  const preds=e.getPredictedEvents(); if(!preds||!preds.length) return;
  const pts=op.pts; if(!pts.length) return;
  const last=pts[pts.length-1];
  let x1=last.x,y1=last.y,x2=last.x,y2=last.y;
  pctx.save();
  pctx.strokeStyle=op.color; pctx.lineWidth=op.lw; pctx.lineCap='round'; pctx.lineJoin='round';
  pctx.beginPath(); pctx.moveTo(last.x,last.y);
  const p=gp(preds[0]); // 첫 예측점만 사용 — 빠른 방향 전환에서 갈고리처럼 튀는 것 방지
  pctx.lineTo(p.x,p.y);
  x1=Math.min(x1,p.x);y1=Math.min(y1,p.y);x2=Math.max(x2,p.x);y2=Math.max(y2,p.y);
  pctx.stroke(); pctx.restore();
  const pad=op.lw+4;
  predBox={x:x1-pad,y:y1-pad,w:x2-x1+pad*2,h:y2-y1+pad*2};
}
function drawShapePreview(op) {
  clearTip();
  drawOp(pctx,op);
  const b=opBounds(op);
  if(b){const pad=(op.lw||2)+6;tipBox={x:b.x1-pad,y:b.y1-pad,w:b.x2-b.x1+pad*2,h:b.y2-b.y1+pad*2};}
}
function addInkPoint(op,p,paint=true) {
  p={x:r1(p.x),y:r1(p.y)}; // 0.1px 단위 — 자동저장·실행취소 용량 절감 (화면·저장본 모두 차이 없음)
  const pts=op.pts;
  if(pts.length) {
    const last=pts[pts.length-1];
    const minDist=0.4; // 중복/노이즈 샘플만 제거 (필기 디테일 유지)
    if(Math.hypot(p.x-last.x,p.y-last.y)<minDist) return false;
  }
  pts.push(p);
  if(paint) seg(op);
  return true;
}
function seg(op) {
  const pts=op.pts; if(pts.length<2)return;
  dx.save();
  dx.globalCompositeOperation=op.type==='erase'?'destination-out':'source-over';
  dx.strokeStyle=op.type==='erase'?'#000':op.color; dx.lineWidth=op.lw; dx.lineCap='round'; dx.lineJoin='round';
  dx.beginPath();
  const a=pts[pts.length-2],b=pts[pts.length-1];
  if(pts.length===2){dx.moveTo(a.x,a.y);dx.lineTo(b.x,b.y);}
  else{const p=pts[pts.length-3];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;dx.moveTo((p.x+a.x)/2,(p.y+a.y)/2);dx.quadraticCurveTo(a.x,a.y,mx,my);}
  dx.stroke(); dx.restore();
}
// 획 종료 처리: 전체 다시 그리기 없이 방금 그은 획만 잉크 레이어에 확정
function finalizeStroke(op) {
  if(!op) return;
  if(op.type==='path'&&CFG.fastInk) { drawOp(dx,op); return; } // 빠른 모드: 미리보기에만 있던 획을 본 레이어에 최종(부드러운) 형태로 그림
  const pts=op.pts||[];
  if(pts.length===1) { drawOp(dx,op); return; } // 점 하나(탭)는 증분 경로가 그리지 못함
  if(pts.length>=3) { // 증분(seg)이 남긴 꼬리 구간: 마지막 중간점 → 마지막 점
    const a=pts[pts.length-2], b=pts[pts.length-1];
    dx.save();
    dx.globalCompositeOperation=op.type==='erase'?'destination-out':'source-over';
    dx.strokeStyle=op.type==='erase'?'#000':op.color; dx.lineWidth=op.lw; dx.lineCap='round'; dx.lineJoin='round';
    dx.beginPath(); dx.moveTo((a.x+b.x)/2,(a.y+b.y)/2); dx.lineTo(b.x,b.y); dx.stroke();
    dx.restore();
  }
}

function drawOp(ctx,op,sc=1) {
  if(op.type==='path'||op.type==='erase') {
    const pts=op.pts; if(!pts||!pts.length)return;
    ctx.save();
    ctx.globalCompositeOperation=op.type==='erase'?'destination-out':'source-over';
    ctx.strokeStyle=op.type==='erase'?'#000':op.color; ctx.lineWidth=op.lw*sc; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(pts[0].x*sc,pts[0].y*sc);
    if(pts.length===1){ctx.arc(pts[0].x*sc,pts[0].y*sc,op.lw*sc/2,0,Math.PI*2);ctx.fillStyle=op.type==='erase'?'#000':op.color;ctx.fill();}
    else{
      for(let i=1;i<pts.length-1;i++){const mx=(pts[i].x+pts[i+1].x)/2*sc,my=(pts[i].y+pts[i+1].y)/2*sc;ctx.quadraticCurveTo(pts[i].x*sc,pts[i].y*sc,mx,my);}
      ctx.lineTo(pts[pts.length-1].x*sc,pts[pts.length-1].y*sc); ctx.stroke();
    }
    ctx.restore();
  } else if(op.type==='line'||op.type==='curve') {
    ctx.save();
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=op.color; ctx.lineWidth=op.lw*sc; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(op.x1*sc,op.y1*sc);
    if(op.type==='curve') ctx.quadraticCurveTo(op.cx*sc,op.cy*sc,op.x2*sc,op.y2*sc);
    else ctx.lineTo(op.x2*sc,op.y2*sc);
    ctx.stroke();
    ctx.restore();
  } else if(op.type==='sticker') {
    if(op.imgSrc) {
      // Custom image sticker
      const img = IMG_CACHE[op.imgSrc];
      if(img && img.complete && img.naturalWidth>0) {
        const s=op.size*sc;
        ctx.save(); ctx.translate(op.x*sc,op.y*sc); ctx.rotate(op.angle||0); ctx.drawImage(img,-s/2,-s/2,s,s); ctx.restore();
      } else if(!IMG_CACHE[op.imgSrc]) {
        // Load and redraw when ready
        const newImg=new Image(); newImg.onload=()=>{IMG_CACHE[op.imgSrc]=newImg;redraw();};
        newImg.src=op.imgSrc; IMG_CACHE[op.imgSrc]=newImg;
      }
    } else {
      ctx.save(); ctx.translate(op.x*sc,op.y*sc); ctx.rotate(op.angle||0); ctx.font=`${op.size*sc}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(op.emoji,0,0); ctx.restore();
    }
  } else if(op.type==='text') {
    ctx.save(); ctx.translate(op.x*sc,op.y*sc); ctx.rotate(op.angle||0); ctx.font=`bold ${op.fs*sc}px sans-serif`; ctx.fillStyle=op.color;
    const lines=String(op.text||'').split('\n'), lh=op.fs*1.4*sc;
    lines.forEach((ln,i)=>ctx.fillText(ln,0,i*lh));
    ctx.restore();
  }
}

function drawBoxControls(b) {
  if(!b) return;
  const rhx=(b.x1+b.x2)/2, rhy=b.y1-30;
  dx.setLineDash([]);
  dx.strokeStyle='#4f46e5'; dx.lineWidth=1.5;
  dx.beginPath(); dx.moveTo((b.x1+b.x2)/2,b.y1); dx.lineTo(rhx,rhy); dx.stroke();
  dx.fillStyle='#7c3aed'; dx.beginPath(); dx.arc(rhx,rhy,7,0,Math.PI*2); dx.fill();
  dx.strokeStyle='#fff'; dx.lineWidth=1.5; dx.stroke();
  dx.fillStyle='#4f46e5'; dx.beginPath(); dx.arc(b.x2+6,b.y2+6,7,0,Math.PI*2); dx.fill();
  dx.strokeStyle='#fff'; dx.lineWidth=1.5; dx.stroke();
  dx.beginPath(); dx.moveTo(b.x2+2,b.y2+6); dx.lineTo(b.x2+10,b.y2+6);
  dx.moveTo(b.x2+6,b.y2+2); dx.lineTo(b.x2+6,b.y2+10); dx.stroke();
}
function redraw() {dx.clearRect(0,0,S.cw,S.ch); S.ops.forEach(op=>drawOp(dx,op)); drawSelection();}
function drawSelection() {
  if(S.selList&&S.selList.length>1) {
    dx.save();
    dx.strokeStyle='#4f46e5'; dx.lineWidth=2; dx.setLineDash([5,3]);
    const b=selectedBounds();
    if(b) {
      dx.setLineDash([]); dx.strokeStyle='#312e81'; dx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
      drawBoxControls(b);
    }
    dx.restore();
    return;
  }
  if(S.selI<0||S.selI>=S.ops.length) return;
  const op=S.ops[S.selI];
  dx.save(); dx.strokeStyle='#4f46e5'; dx.lineWidth=2; dx.setLineDash([5,3]);
  if(op.type==='sticker') {
    const h=op.size/2+4;
    dx.strokeRect(op.x-h,op.y-h,h*2,h*2);
    // 리사이즈 핸들 (우하단 파란 원)
    const hx=op.x+op.size/2+4, hy=op.y+op.size/2+4;
    dx.setLineDash([]);
    dx.fillStyle='#4f46e5'; dx.beginPath(); dx.arc(hx,hy,7,0,Math.PI*2); dx.fill();
    dx.strokeStyle='#fff'; dx.lineWidth=1.5;
    dx.beginPath(); dx.moveTo(hx-4,hy); dx.lineTo(hx+4,hy);
    dx.moveTo(hx,hy-4); dx.lineTo(hx,hy+4); dx.stroke();
  } else if(op.type==='text') {
    const m=textMetrics(op), h=op.fs*1.4, w=m.w, totalH=h+(m.n-1)*m.lh;
    dx.strokeRect(op.x-4,op.y-h-4,w+8,totalH+10);
    // 리사이즈 핸들 (우하단 파란 원)
    const hx=op.x+w+4, hy=op.y+(m.n-1)*m.lh+6;
    dx.setLineDash([]);
    dx.fillStyle='#4f46e5'; dx.beginPath(); dx.arc(hx,hy,7,0,Math.PI*2); dx.fill();
    dx.strokeStyle='#fff'; dx.lineWidth=1.5;
    dx.beginPath(); dx.moveTo(hx-4,hy); dx.lineTo(hx+4,hy);
    dx.moveTo(hx,hy-4); dx.lineTo(hx,hy+4); dx.stroke();
  } else {
    const b=opBounds(op);
    if(b) {
      dx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
      dx.setLineDash([]);
      const drawHandle=(x,y,fill='#4f46e5')=>{
        dx.fillStyle=fill; dx.beginPath(); dx.arc(x,y,7,0,Math.PI*2); dx.fill();
        dx.strokeStyle='#fff'; dx.lineWidth=1.5; dx.stroke();
      };
      drawBoxControls(b);
      if(op.type==='line'||op.type==='curve') {
        if(op.type==='curve') {
          dx.strokeStyle='rgba(245,158,11,.8)';
          dx.lineWidth=1.5;
          dx.setLineDash([4,4]);
          dx.beginPath(); dx.moveTo(op.x1,op.y1); dx.lineTo(op.cx,op.cy); dx.lineTo(op.x2,op.y2); dx.stroke();
          dx.setLineDash([]);
        }
        drawHandle(op.x1,op.y1,'#16a34a');
        drawHandle(op.x2,op.y2,'#dc2626');
        if(op.type==='curve') drawHandle(op.cx,op.cy,'#f59e0b');
      }
    }
  }
  dx.restore();
}

// ── Text ─────────────────────────────────────────────────────────
function addText(x,y) { openTextEditor({type:'text',x,y,fs:S.tfs,color:S.color,text:''}, null); } // type 필수: 화면 크기 변화 시 좌표 환산(scaleOpsList)이 종류로 판별함
// 기존 텍스트 더블탭 → 그 자리에서 내용 수정 (지우고 다시 쓸 필요 없음)
function editText(i) {
  const op=S.ops[i]; if(!op||op.type!=='text') return;
  beginHistory();            // 원본 포함 스냅샷 → 수정 전체가 실행취소 1회로 묶임
  S.ops.splice(i,1);         // 편집 중에는 캔버스에서 숨김 (입력창과 겹침 방지)
  S.selI=-1; S.selList=[]; S.dragI=-1;
  redraw();
  openTextEditor(op, i);
}
function openTextEditor(op, origIndex) {
  const wrap=document.getElementById('cw');
  const inp=document.createElement('textarea'); inp.rows=1; inp.wrap='off'; inp.spellcheck=false;
  // 입력창을 연 시점의 캔버스 폭. 입력 도중 회전·키보드 등으로 화면 크기가 바뀌면 필기 좌표 전체가 새 폭으로 보정되므로,
  // 이 글자도 확정할 때 같은 비율로 환산해야 제자리에 찍힘 (예전엔 엉뚱한 곳으로 튀었음)
  const cw0=S.cw;
  const top0=origIndex==null?op.y-14:op.y-op.fs; // 편집 시엔 원래 글자 위치에 겹치게
  // fontFamily: 캔버스가 그리는 글꼴(sans-serif)과 같게 — 확정 순간 글자 폭이 바뀌지 않도록
  Object.assign(inp.style,{position:'absolute',border:`2px dashed ${op.color}`,background:'rgba(255,255,255,.88)',color:op.color,lineHeight:'1.4',padding:'3px 8px',borderRadius:'6px',outline:'none',minWidth:'110px',zIndex:'5',fontFamily:'sans-serif',fontWeight:'bold',resize:'none',overflow:'hidden',whiteSpace:'pre'});
  inp.value=op.text||'';
  // 입력 내용에 맞춰 가로·세로 자동 확장 (여러 줄이 보이도록)
  const autosize=()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';inp.style.width='auto';inp.style.width=Math.max(110,inp.scrollWidth+4)+'px';};
  const place=()=>{const r=S.cw/cw0; inp.style.left=op.x*r+'px'; inp.style.top=top0*r+'px'; inp.style.fontSize=op.fs*r+'px'; autosize();};
  const fit=()=>{const r=S.cw/cw0; if(Math.abs(r-1)>0.0005) scaleOpsList([op],r);}; // 글자 좌표·크기를 현재 캔버스 기준으로
  const close=()=>{textEditorSync=null; inp.remove();};
  wrap.appendChild(inp); place(); inp.focus();
  textEditorSync=place; // 열려 있는 동안 화면 크기가 바뀌면 입력창도 따라 이동
  const restore=()=>{ // 편집 취소 → 원본을 원래 자리(z순서)로 복원
    if(origIndex!=null){fit();S.ops.splice(Math.min(origIndex,S.ops.length),0,op);cancelHistory();redraw();}
  };
  // commit 시작 시 onblur 해제: remove()가 blur를 유발해 같은 텍스트가 두 번 들어가는 것 방지
  const commit=()=>{
    inp.onblur=null;
    const t=inp.value.replace(/\s+$/,'');
    fit();
    if(origIndex!=null) { // 편집: 내용만 바꿔 원래 자리로 (비우면 삭제, 내용 같으면 히스토리 없음)
      if(t){const n=Object.assign({},op,{text:t});S.ops.splice(Math.min(origIndex,S.ops.length),0,n);S.selI=S.ops.indexOf(n);}
      commitHistory(); redraw(); scheduleDraftSave();
    } else if(t) {
      beginHistoryAppend();S.selI=S.ops.length;S.ops.push({type:'text',text:t,x:op.x,y:op.y,fs:op.fs,color:op.color});commitHistory();redraw();scheduleDraftSave();
    }
    close();
  };
  inp.oninput=autosize;
  // Enter=줄바꿈(textarea 기본). 완료=영역 밖 탭(blur) 또는 Ctrl/⌘+Enter, 취소=Esc
  inp.onkeydown=e=>{
    if(e.key==='Escape'){inp.onblur=null;restore();close();return;}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();commit();}
  };
  inp.onblur=commit;
}

// ── Undo / Clear ─────────────────────────────────────────────────
function undo() {
  if(!S.hist.length)return;
  const h=S.hist.pop();
  if(h&&h.append) { // 추가 되돌리기: 마지막 하나만 빼서 '다시 실행'용으로 보관 (전체 복사 없음)
    const op=S.ops.pop();
    if(op) S.future.push({append:true,op});
    S.selI=-1; S.selList=[]; S.dragI=-1;
    redraw(); scheduleDraftSave();
  } else {
    S.future.push(cloneOpsState());
    restoreOpsState(h);
  }
  toast('실행 취소');
}
function redo() {
  if(!S.future.length)return;
  const f=S.future.pop();
  if(f&&f.append) {
    S.ops.push(f.op);
    S.hist.push({append:true});
    redraw(); scheduleDraftSave();
  } else {
    S.hist.push(cloneOpsState());
    restoreOpsState(f);
  }
  toast('다시 실행');
}
function clearAll() {
  if(deleteSelectedOps()) return;
  if(!S.ops.length)return;
  if(!confirm('모든 필기와 스티커를 지울까요?'))return;
  beginHistory();
  S.ops=[];
  commitHistory();
  redraw();scheduleDraftSave();toast('전체 지웠어요');
}

// ── Build export canvas ───────────────────────────────────────────
function buildExportCanvas(format='image/png', quality=1) {
  const ec=document.createElement('canvas'); ec.width=S.nw; ec.height=S.nh;
  const ctx=ec.getContext('2d'); const sc=S.nw/S.cw;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,S.nw,S.nh);
  ctx.drawImage(S.img,0,0,S.nw,S.nh);
  // 필기는 별도 투명 레이어에 그린 뒤 합성 (화면의 dc 레이어와 동일).
  // 지우개(destination-out)가 배경 학습지·흰 바탕까지 뚫어 투명 구멍을 내면
  // JPEG 변환 시 그 구멍이 검게 칠해지므로, 잉크 레이어를 분리해 막는다.
  const il=document.createElement('canvas'); il.width=S.nw; il.height=S.nh;
  const ix=il.getContext('2d');
  S.ops.forEach(op=>drawOp(ix,op,sc));
  ctx.drawImage(il,0,0);
  return ec;
}

function exportImg() {

  const ec=buildExportCanvas();

}

async function ensureJsPDF() {
  if(window.jspdf) return;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}

async function exportAllPagesPDF() {
  if(pageSwitching()) return;
  toast('PDF 저장 준비 중...');
  // 현재 페이지 메모 저장
  rememberCurrentPDFPage();
  saveDraftNow();
  try { await ensureJsPDF(); } catch(e) { toast('PDF 라이브러리 로드 실패. 인터넷을 확인하세요.'); return; }
  const {jsPDF} = window.jspdf;
  const PT = 0.75; // px → pt 변환
  let doc = null;
  for(let p=1; p<=S.pdfTotal; p++) {
    toast(`PDF 변환 중... ${p}/${S.pdfTotal}`);
    const page = await S.pdfDoc.getPage(p);
    const vp = page.getViewport({scale:2});
    const bgC = document.createElement('canvas');
    bgC.width=vp.width; bgC.height=vp.height;
    await page.render({canvasContext:bgC.getContext('2d'), viewport:vp}).promise;
    const ec = document.createElement('canvas');
    ec.width=vp.width; ec.height=vp.height;
    const ctx = ec.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,ec.width,ec.height);
    ctx.drawImage(bgC,0,0);
    const ops = S.pdfOps[p] || [];
    const dims = S.pdfDims[p];
    const sc = dims ? vp.width/dims.cw : vp.width/S.cw;
    // 필기를 별도 투명 레이어에 그려 합성 — 지우개가 배경 PDF를 뚫어 검게 변하는 것 방지
    const ilC=document.createElement('canvas'); ilC.width=ec.width; ilC.height=ec.height;
    const ilX=ilC.getContext('2d');
    ops.forEach(op=>drawOp(ilX,op,sc));
    ctx.drawImage(ilC,0,0);
    const w=vp.width*PT, h=vp.height*PT;
    const imgData = ec.toDataURL('image/jpeg', 0.92);
    if(!doc) {
      doc = new jsPDF({orientation:w>h?'l':'p', unit:'pt', format:[w,h]});
      doc.addImage(imgData,'JPEG',0,0,w,h);
    } else {
      doc.addPage([w,h], w>h?'l':'p');
      doc.addImage(imgData,'JPEG',0,0,w,h);
    }
  }
  doc.save(`학습지_${new Date().toISOString().slice(0,10)}.pdf`);
  toast('💾 전체 PDF 저장 완료!');
}

async function buildAllPagesPDFBlob(progressPrefix='PDF 변환 중...') {
  rememberCurrentPDFPage();
  saveDraftNow();
  await ensureJsPDF();
  const {jsPDF} = window.jspdf;
  const PT = 0.75;
  let doc = null;
  for(let p=1; p<=S.pdfTotal; p++) {
    toast(`${progressPrefix} ${p}/${S.pdfTotal}`);
    const page = await S.pdfDoc.getPage(p);
    const vp = page.getViewport({scale:2});
    const bgC = document.createElement('canvas');
    bgC.width=vp.width; bgC.height=vp.height;
    await page.render({canvasContext:bgC.getContext('2d'), viewport:vp}).promise;
    const ec = document.createElement('canvas');
    ec.width=vp.width; ec.height=vp.height;
    const ctx = ec.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,ec.width,ec.height);
    ctx.drawImage(bgC,0,0);
    const ops = S.pdfOps[p] || [];
    const dims = S.pdfDims[p];
    const sc = dims ? vp.width/dims.cw : vp.width/S.cw;
    // 필기를 별도 투명 레이어에 그려 합성 — 지우개가 배경 PDF를 뚫어 검게 변하는 것 방지
    const ilC=document.createElement('canvas'); ilC.width=ec.width; ilC.height=ec.height;
    const ilX=ilC.getContext('2d');
    ops.forEach(op=>drawOp(ilX,op,sc));
    ctx.drawImage(ilC,0,0);
    const w=vp.width*PT, h=vp.height*PT;
    const imgData = ec.toDataURL('image/jpeg', 0.92);
    if(!doc) {
      doc = new jsPDF({orientation:w>h?'l':'p', unit:'pt', format:[w,h]});
      doc.addImage(imgData,'JPEG',0,0,w,h);
    } else {
      doc.addPage([w,h], w>h?'l':'p');
      doc.addImage(imgData,'JPEG',0,0,w,h);
    }
  }
  return doc.output('blob');
}

function blobToDataURL(blob) {
  return new Promise((res,rej)=>{
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = rej;
    reader.readAsDataURL(blob);
  });
}

function safeFilenamePart(s) {
  return (s||'미입력').replace(/[\\/:*?"<>|]/g,'_').trim() || '미입력';
}

// 제출 진행 중 재진입 차단 + 버튼 비활성 (연타로 Drive에 중복 파일 쌓이는 것 방지)
let submitBusy=false;
function setSubmitBusy(b) {
  submitBusy=b;
  ['submit-img-btn','submit-pdf-btn'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.disabled=b;el.style.opacity=b?'.55':'';}
  });
}
function submitPayload(name, dataUrl, mime, filename, filetype) {
  const body = new URLSearchParams({
    name: name,
    image: dataUrl,
    mime: mime,
    filename: filename,
    filetype: filetype || (mime==='application/pdf'?'pdf':'jpg'),
    timestamp: new Date().toLocaleString('ko-KR'),
  }).toString();
  // 응답을 실제로 확인 — URL 오타·배포 권한 문제·서버 오류 시 거짓 '제출 완료' 방지
  // (urlencoded는 CORS 단순 요청이라 preflight 없이 Apps Script 응답을 읽을 수 있음)
  // 60초 타임아웃: 느린 와이파이에서 '제출 중' 상태로 하염없이 걸려 있는 것 방지
  const ctrl=window.AbortController?new AbortController():null;
  const tid=ctrl?setTimeout(()=>ctrl.abort(),60000):null;
  fetch(CFG.webhookUrl, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body, signal:ctrl?ctrl.signal:undefined})
    .then(r => r.text())
    .then(t => {
      let j=null; try{j=JSON.parse(t);}catch(_){}
      if(j&&j.ok) toast('✅ 제출 완료! 선생님 Drive에 저장됐어요.');
      else throw new Error((j&&j.error)||'서버 응답 확인 실패');
    })
    .catch(e => toast(e&&e.name==='AbortError'
      ? '⚠️ 제출이 60초를 넘겨 중단했어요 — 와이파이 확인 후 다시 시도해 주세요'
      : '⚠️ 제출을 확인하지 못했어요 — 💾 저장 버튼으로 파일을 받아 직접 제출해 주세요'))
    .finally(()=>{if(tid)clearTimeout(tid);setSubmitBusy(false);});
}

function askSubmitName() {
  // 마지막 제출 이름을 기억해 기본값으로 제시 — 다음부터는 확인만 누르면 됨
  let last=''; try{last=localStorage.getItem(STORAGE_KEYS.studentName)||'';}catch(_){}
  const raw=prompt('이름을 입력하세요:', last);
  if(raw===null) return null; // 취소 → 제출 중단 (익명 오제출 방지)
  const name=raw.trim() || '미입력';
  if(name!=='미입력') try{localStorage.setItem(STORAGE_KEYS.studentName,name);}catch(_){}
  return name;
}

function makeSubmitBaseName(name) {
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  return safeFilenamePart(name) + '_' + stamp;
}

// ── Submit to server ──────────────────────────────────────────────
async function submitImageWork() {
  if(submitBusy){toast('제출 처리 중이에요 — 잠시만 기다려 주세요');return;}
  if(pageSwitching()) return;
  if(!CFG.webhookUrl){toast('제출 서버가 설정되지 않았어요');return;}
  if(S._tainted){toast('이 이미지는 제출이 제한돼요. 파일 업로드 방식을 사용하세요.');return;}

  const name = askSubmitName();
  if(name===null){toast('제출을 취소했어요');return;}
  setSubmitBusy(true);
  toast('이미지 제출 중...');

  try {
    const base = makeSubmitBaseName(name);
    const ec = buildExportCanvas();
    ec.toBlob(async blob => {
      try {
        if(!blob) throw new Error('인코딩 실패');
        const dataUrl = await blobToDataURL(blob);
        submitPayload(name, dataUrl, 'image/jpeg', base + '.jpg', 'jpg');
      } catch(err) { // toBlob 콜백 내부 오류는 바깥 try가 못 잡음 — 여기서 직접 안내
        setSubmitBusy(false);
        toast('이미지 변환에 실패했어요 — 💾 저장 버튼으로 파일을 받아 직접 제출해 주세요');
      }
    }, 'image/jpeg', 0.75);
  } catch(e) {
    setSubmitBusy(false);
    toast('이미지 제출 파일 생성 실패');
  }
}

async function submitPDFWork() {
  if(submitBusy){toast('제출 처리 중이에요 — 잠시만 기다려 주세요');return;}
  if(pageSwitching()) return;
  if(!CFG.webhookUrl){toast('제출 서버가 설정되지 않았어요');return;}

}

const GAS_CODE = `function doPost(e) {

    var ts   = e.parameter.timestamp || new Date().toLocaleString('ko-KR');

    if (!mime && m) mime = m[1];
    var img = raw.indexOf(',') > -1 ? raw.split(',')[1] : raw;
    var isPdf = filetype === 'pdf' || mime === 'application/pdf' || img.substring(0, 8) === 'JVBERi0';
    mime = isPdf ? 'application/pdf' : 'image/jpeg';
    var ext = isPdf ? 'pdf' : 'jpg';
    if (!filename) filename = name + '_' + ts.replace(/[\\/:*?"<>|]/g,'_') + '.' + ext;
    filename = filename.replace(/[\\/:*?"<>|]/g,'_').replace(/\\.(pdf|jpg|jpeg)$/i, '') + '.' + ext;
    var blob = Utilities.newBlob(
      Utilities.base64Decode(img),
      mime,
      filename
    );
    blob.setName(filename);

function copyText(t,okMsg) {
  okMsg=okMsg||'📋 복사됨!';
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      toast(okMsg);
    }catch(_){toast('복사 실패 — 직접 선택해 복사해 주세요');}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>toast(okMsg)).catch(fallback);
  else fallback();
}

  <li><a href="https://app.netlify.com/drop" target="_blank" style="color:var(--ind)">app.netlify.com/drop</a> 접속</li>
  <li>이 <b>디지털학습지.html</b> 파일 드래그 & 드롭</li>
  <li>자동으로 공개 URL 발급 — 동료 선생님과 공유!</li>
</ol>`;
  } else if(!shareUrl) {
    inner=`<h2>🔗 URL 공유</h2><p>Google Drive 탭 또는 URL 탭으로 이미지를 불러오면 학생용 링크와 QR 코드가 생성돼요.</p>`;
  } else {
    const qr=`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(shareUrl)}`;
    inner=`<h2>🔗 학생 공유 링크</h2><p>QR 코드를 출력하거나 Google 클래스룸에 이 URL을 붙여넣으세요.</p>
<div class="share-url" id="su">${shareUrl}</div>
<div class="qr-wrap"><img src="${qr}" width="220" height="220" alt="QR"></div>
<div class="btn-row">
  <button class="btn bi" onclick="copyText(document.getElementById('su').textContent)">📋 URL 복사</button>
  <button class="btn b2" onclick="document.querySelector('.overlay').remove()">닫기</button>
</div>`;
  }
  ov.innerHTML=`<div class="sheet">${inner}<br><button class="btn b2" style="width:100%" onclick="document.querySelector('.overlay').remove()">닫기</button></div>`;
  document.body.appendChild(ov);
}

// ── Toast ─────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('on'),2500);
}

// ── PWA Service Worker ────────────────────────────────────────────
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
